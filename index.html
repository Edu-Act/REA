<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<title>REA LAB.</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:#f0f0f0;color:#333;font-size:14px}

#loginOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:15vh;
  z-index:9999;transition:opacity .4s;
}
#loginBox{
  background:#fff;border-radius:10px;padding:40px 36px 25px;width:360px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  transition:transform .4s,opacity .4s;
  display:flex;flex-direction:column;
}
#loginBox h2{text-align:center;margin-bottom:24px;font-size:20px;color:#444}
#loginBox input{width:100%;padding:10px 12px;margin-bottom:14px;border:1px solid #ccc;border-radius:6px;font-size:14px}
#loginBox #loginPw{margin-bottom:38px}

#loginBtn{
  width:100%;height:40px;padding:0;color:#fff;border:none;border-radius:6px;
  font-size:15px;cursor:pointer;font-weight:600;
  position:relative;overflow:hidden;
  background:#4a7dff;
  transition:background .15s;
}
#loginBtn .btn-text{
  position:relative;z-index:1;user-select:none;
  font-size:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block;line-height:40px;
}
#loginBtn.progress .btn-text{font-size:12px}
#loginBtn:hover:not(:disabled):not(.progress){background:#3a65d4}
#loginBtn:disabled:not(.progress){cursor:not-allowed}
#loginBtn.progress{
  background:#e2e8f0;color:#fff;cursor:pointer;
}
#loginBtn .btn-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,#4a7dff,#5a8aff);
  transition:width .4s ease;border-radius:6px;
}
#loginBtn .btn-fill.complete{background:#38a169}
#loginBtn .btn-fill.error{background:#e53e3e}
#loginBtn .btn-fill.paused{
  background:repeating-linear-gradient(
    -45deg,
    #4a7dff, #4a7dff 8px,
    #5a8aff 8px, #5a8aff 16px
  );
}
#loginError{color:#d32;font-size:13px;text-align:center;margin-top:0;min-height:0}

#processWrap{
  max-height:0;overflow:hidden;
  transition:max-height .5s ease;
}
#processArea{
  padding-top:14px;margin-top:18px;
  border-top:1px solid #e8ecf1;
}

.proc-steps{display:flex;flex-direction:column;gap:0}
.proc-step{
  display:flex;align-items:center;
  font-size:12.5px;color:#cbd5e0;
  position:relative;padding-left:24px;min-height:26px;
  transition:color .3s;
}
.proc-step::before{
  content:'';position:absolute;left:7px;top:18px;
  width:1.5px;height:calc(100%);background:#e8ecf1;
}
.proc-step:last-child::before{display:none}
.proc-step .step-dot{
  position:absolute;left:1px;top:5px;
  width:14px;height:14px;border-radius:50%;
  border:2px solid #e2e8f0;background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;transition:all .3s;z-index:1;
}
.proc-step.active{color:#4a7dff;font-weight:600}
.proc-step.active .step-dot{
  border-color:#4a7dff;background:#4a7dff;
  box-shadow:0 0 0 3px rgba(74,125,255,.15);
}
.proc-step.active .step-dot::after{
  content:'';width:4px;height:4px;border-radius:50%;background:#fff;
  animation:dotPulse .8s ease infinite;
}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.proc-step.done{color:#38a169}
.proc-step.done .step-dot{border-color:#38a169;background:#38a169;box-shadow:none}
.proc-step.done .step-dot::after{content:'✓';color:#fff;font-size:8px;font-weight:700;animation:none}
.proc-step.error{color:#e53e3e}
.proc-step.error .step-dot{border-color:#e53e3e;background:#e53e3e;box-shadow:none}
.proc-step.error .step-dot::after{content:'✕';color:#fff;font-size:8px;font-weight:700;animation:none}
.proc-step.paused{color:#a0aec0;font-weight:600}
.proc-step.paused .step-dot{
  border-color:#a0aec0;background:#a0aec0;box-shadow:none;
}
.proc-step.paused .step-dot::after{
  content:'❚❚';color:#fff;font-size:6px;font-weight:700;animation:none;letter-spacing:-1px;
}
.step-label{line-height:1.5}

#bookmarkBtn{
  width:100%;padding:11px;color:#fff;border:none;border-radius:6px;
  font-size:15px;cursor:pointer;font-weight:600;
  background:#7ec8e3;margin-top:6px;
  max-height:50px;overflow:hidden;
  transition:background .15s, max-height .35s ease, opacity .3s ease, margin-top .35s ease, padding .35s ease;
}
#bookmarkBtn.collapsed{
  max-height:0;opacity:0;margin-top:0;padding:0;pointer-events:none;
}
#bookmarkBtn:hover{background:#5bb3d5}
#bookmarkBtn.active{background:#5bb3d5}

#bookmarkFormWrap{
  max-height:0;overflow:hidden;
  transition:max-height .4s ease;
}
#bookmarkForm{
  padding-top:14px;margin-top:24px;
  border-top:1px solid #e8ecf1;
  display:flex;flex-direction:column;gap:10px;
}
#bookmarkForm input[type="text"]{
  width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;
  margin-bottom:0;
}
#bookmarkForm input[type="text"]::placeholder{color:#aaa}
.bm-page-row{
  display:flex;align-items:center;gap:8px;
}
.bm-page-row input[type="text"]{flex:1;margin-bottom:0}
.bm-tilde{color:#999;font-size:16px;font-weight:600;flex-shrink:0}
#bookmarkMsg{font-size:12.5px;text-align:center;min-height:18px;margin-top:4px}
.bm-success{color:#38a169}
.bm-error{color:#e53e3e}
#bookmarkSubmitBtn{
  width:100%;padding:10px;color:#fff;border:none;border-radius:6px;
  font-size:14px;cursor:pointer;font-weight:600;
  background:#38a169;transition:background .15s;
  margin-bottom:0;
}
#bookmarkSubmitBtn:hover:not(:disabled){background:#2f855a}
#bookmarkSubmitBtn:disabled{background:#a0aec0;cursor:not-allowed}

#numpadOverlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:10000;align-items:center;justify-content:center;
}
#numpadOverlay.show{display:flex}
#numpadBox{
  background:#fff;border-radius:12px;padding:20px;width:260px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}
#numpadDisplay{
  width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;
  font-size:18px;text-align:center;margin-bottom:12px;
  background:#f8f9fa;color:#333;
  min-height:44px;line-height:22px;
}
.numpad-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.numpad-grid button{
  padding:14px 0;font-size:18px;font-weight:600;border:1px solid #e2e8f0;
  border-radius:8px;background:#fff;cursor:pointer;color:#333;
  transition:background .1s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.numpad-grid button:hover{background:#f0f4ff}
.numpad-grid button:active{background:#e2e8f0}
.numpad-grid .np-back{font-size:14px;color:#e53e3e}
.numpad-grid .np-confirm{background:#38a169;color:#fff;border-color:#38a169}
.numpad-grid .np-confirm:hover{background:#2f855a}

.login-fade-out #loginBox{transform:translateY(-20px);opacity:0}
.login-fade-out{opacity:0}
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginBox">
    <h2>REA LAB.</h2>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="email">
    <input type="password" id="loginPw" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="handleBtnClick()"><span class="btn-text">Login</span></button>
    <div id="loginError"></div>

    <button id="bookmarkBtn" onclick="toggleBookmarkForm()">Bookmark</button>
    <div id="bookmarkFormWrap">
      <div id="bookmarkForm">
        <input type="text" id="bmReference" placeholder="Reference">
        <div class="bm-page-row">
          <input type="text" id="bmPageFrom" placeholder="From" readonly>
          <span class="bm-tilde">~</span>
          <input type="text" id="bmPageTo" placeholder="To" readonly>
        </div>
        <input type="text" id="bmSentence" placeholder="Sentence" style="margin-bottom:10px">
        <input type="text" id="bmComment" placeholder="Comment">
        <div id="bookmarkMsg"></div>
        <button id="bookmarkSubmitBtn" onclick="submitBookmark()">Bookmark Save</button>
      </div>
    </div>

    <div id="processWrap">
      <div id="processArea">
        <div class="proc-steps">
          <div class="proc-step" id="ps1"><span class="step-dot"></span><span class="step-label">Log-in 정보 유효성 검증</span></div>
          <div class="proc-step" id="ps2"><span class="step-dot"></span><span class="step-label">Log-in 정보 서버 인증 요청</span></div>
          <div class="proc-step" id="ps3"><span class="step-dot"></span><span class="step-label">Log-in 정보 서버 응답 수신</span></div>
          <div class="proc-step" id="ps4"><span class="step-dot"></span><span class="step-label">Data API 호출</span></div>
          <div class="proc-step" id="ps5"><span class="step-dot"></span><span class="step-label">Category & Element 수신 및 처리</span></div>
          <div class="proc-step" id="ps6"><span class="step-dot"></span><span class="step-label">Serge Card 자료 수신 및 처리</span></div>
          <div class="proc-step" id="ps7"><span class="step-dot"></span><span class="step-label">Bookmark 자료 수신 및 처리</span></div>
          <div class="proc-step" id="ps8"><span class="step-dot"></span><span class="step-label">Preload Data 세션에 저장</span></div>
          <div class="proc-step" id="ps9"><span class="step-dot"></span><span class="step-label">3초 후 Main Page로 이동</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="numpadOverlay">
  <div id="numpadBox">
    <div id="numpadLabel" style="text-align:center;font-size:13px;color:#888;margin-bottom:6px"></div>
    <div id="numpadDisplay"></div>
    <div class="numpad-grid">
      <button data-np="1">1</button>
      <button data-np="2">2</button>
      <button data-np="3">3</button>
      <button data-np="4">4</button>
      <button data-np="5">5</button>
      <button data-np="6">6</button>
      <button data-np="7">7</button>
      <button data-np="8">8</button>
      <button data-np="9">9</button>
      <button class="np-back" data-np="back">&larr;</button>
      <button data-np="0">0</button>
      <button class="np-confirm" data-np="ok">OK</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqh02HRq4fG7XsAYQtHNBqsTxHeEkfDSJ0teBgv8Qqhg3gM8qRrO9Wfdvz4btMBQuygQ/exec';
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
const mainPage = isMobile ? 'realab_m.html' : 'realab.html';
const TOTAL_STEPS = 9;
const FETCH_TIMEOUT = 20000;

let isRunning = false;
let isPaused  = false;
let pauseResolve = null;
let currentStepNum = 0;

(function() {
  try {
    const user = sessionStorage.getItem('realab_user');
    if (user) window.location.replace(mainPage);
  } catch(e) {}
})();

function handleBtnClick() {
  if (!isRunning) {
    doLogin();
  } else {
    togglePause();
  }
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('loginBtn');
  const fill = btn.querySelector('.btn-fill');
  const btnText = btn.querySelector('.btn-text');
  const currentStep = document.querySelector('.proc-step.active, .proc-step.paused');

  if (isPaused) {
    if (fill) fill.classList.add('paused');
    if (btnText) btnText.textContent = '⏸  일시정지 — 클릭하면 재개';
    if (currentStep) {
      currentStep.classList.remove('active');
      currentStep.classList.add('paused');
    }
  } else {
    if (fill) fill.classList.remove('paused');
    if (currentStep) {
      currentStep.classList.remove('paused');
      currentStep.classList.add('active');
    }
    const activeEl = document.getElementById('ps' + currentStepNum);
    const label = activeEl ? activeEl.querySelector('.step-label').textContent : '';
    if (btnText) btnText.textContent = label + '...';
    if (pauseResolve) {
      pauseResolve();
      pauseResolve = null;
    }
  }
}

function checkPause() {
  if (!isPaused) return Promise.resolve();
  return new Promise(resolve => { pauseResolve = resolve; });
}

async function wait(ms) {
  await new Promise(r => setTimeout(r, ms));
  await checkPause();
}

function lockTop() {
}

function revealProcessArea() {
  const wrap = document.getElementById('processWrap');
  wrap.style.maxHeight = '400px';
}

function setBtnProgress(pct, text, state) {
  const btn = document.getElementById('loginBtn');
  let fill = btn.querySelector('.btn-fill');
  if (!fill) {
    fill = document.createElement('div');
    fill.className = 'btn-fill';
    btn.insertBefore(fill, btn.firstChild);
    btn.classList.add('progress');
  }
  fill.style.width = pct + '%';
  fill.classList.remove('complete', 'error', 'paused');
  if (state === 'complete') fill.classList.add('complete');
  if (state === 'error') fill.classList.add('error');
  const btnText = btn.querySelector('.btn-text');
  if (btnText && text) btnText.textContent = text;
}

function setProcessStep(n, isError) {
  currentStepNum = n;
  const pct = Math.min((n / TOTAL_STEPS) * 100, 100);
  const activeEl = document.getElementById('ps' + n);
  const label = activeEl ? activeEl.querySelector('.step-label').textContent : '';

  if (isError) {
    setBtnProgress(pct, '오류 발생', 'error');
  } else if (n > TOTAL_STEPS) {
    setBtnProgress(100, '모든 준비 완료!', 'complete');
  } else {
    setBtnProgress(pct, label + '...');
  }

  for (let i = 1; i <= TOTAL_STEPS; i++) {
    const el = document.getElementById('ps' + i);
    if (!el) continue;
    el.classList.remove('active', 'done', 'error', 'paused');
    if (i < n)       el.classList.add('done');
    else if (i === n) el.classList.add(isError ? 'error' : 'active');
  }
}

function markAllDone() {
  for (let i = 1; i <= TOTAL_STEPS; i++) {
    const el = document.getElementById('ps' + i);
    if (el) { el.classList.remove('active', 'paused'); el.classList.add('done'); }
  }
}

async function gasFetch(url, retries) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
      const r = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      const text = await r.text();
      try { return JSON.parse(text); }
      catch(_) { throw new Error('서버 응답 파싱 오류'); }
    } catch(e) {
      if (e.name === 'AbortError') {
        if (attempt < retries) { await new Promise(r => setTimeout(r, 800)); continue; }
        throw new Error('서버 응답 시간 초과 (20초)');
      }
      if (attempt < retries) { await new Promise(r => setTimeout(r, 800)); continue; }
      throw e;
    }
  }
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value.trim();
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');

  errEl.textContent = '';
  isRunning = true;

  const bmWrap = document.getElementById('bookmarkFormWrap');
  const bmBtn = document.getElementById('bookmarkBtn');
  const hadBookmarkOpen = bookmarkFormOpen;
  bmWrap.style.maxHeight = '0';
  bookmarkFormOpen = false;

  await new Promise(r => setTimeout(r, hadBookmarkOpen ? 300 : 0));
  bmBtn.classList.add('collapsed');
  await new Promise(r => setTimeout(r, 300));

  lockTop();
  revealProcessArea();

  setProcessStep(1);
  await wait(300);

  if (!email || !pw) {
    setProcessStep(1, true);
    errEl.textContent = '이메일과 비밀번호를 입력하세요.';
    isRunning = false;
    document.getElementById('bookmarkBtn').classList.remove('collapsed');
    return;
  }

  setProcessStep(2);

  try {
    await wait(150);
    await checkPause();
    const loginUrl = GAS_URL + '?' + new URLSearchParams({ action: 'login', email, password: pw }).toString();
    const res = await gasFetch(loginUrl, 1);

    await checkPause();

    setProcessStep(3);
    await wait(350);

    if (!res.ok) {
      setProcessStep(3, true);
      errEl.textContent = res.error || '로그인 실패';
      resetBtn(btn); isRunning = false;
      return;
    }

    sessionStorage.setItem('realab_user', JSON.stringify(res.user));
    await checkPause();

    setProcessStep(4);
    await wait(200);
    await checkPause();
    const dataUrl = GAS_URL + '?' + new URLSearchParams({ action: 'getAll' }).toString();
    const data = await gasFetch(dataUrl, 2);

    await checkPause();

    if (!data.ok) {
      setProcessStep(4, true);
      errEl.textContent = '데이터 로드 실패: ' + (data.error || '');
      resetBtn(btn); isRunning = false;
      return;
    }

    setProcessStep(5);
    await wait(350);
    await checkPause();

    setProcessStep(6);
    await wait(350);
    await checkPause();

    setProcessStep(7);
    try {
      const bmUrl = BOOKMARK_GAS_URL + '?action=getBookmarks&t=' + Date.now();
      const bmData = await gasFetch(bmUrl, 1);
      if (bmData.ok) {
        sessionStorage.setItem('realab_bookmarks', JSON.stringify(bmData.bookmarks || []));
      }
    } catch(e) { /* bookmark preload failure is non-blocking */ }
    await wait(300);
    await checkPause();

    setProcessStep(8);
    sessionStorage.setItem('realab_preload', JSON.stringify(data));
    await wait(300);
    await checkPause();

    setProcessStep(9);
    markAllDone();
    const stepLabel9 = document.querySelector('#ps9 .step-label');
    const btnText9 = document.querySelector('#loginBtn .btn-text');
    for (let sec = 3; sec >= 1; sec--) {
      if (stepLabel9) stepLabel9.textContent = sec + '초 후 메인 페이지로 이동';
      if (btnText9) btnText9.textContent = sec + '초 후 메인 페이지로 이동...';
      setBtnProgress(100, null, 'complete');
      await new Promise(r => setTimeout(r, 1000));
    }

    document.getElementById('loginOverlay').classList.add('login-fade-out');
    setTimeout(() => { window.location.href = mainPage; }, 400);

  } catch (e) {
    const cur = document.querySelector('.proc-step.active, .proc-step.paused');
    const idx = cur ? parseInt(cur.id.replace('ps','')) : 2;
    setProcessStep(idx, true);
    errEl.textContent = '서버 연결 오류: ' + e.message;
    resetBtn(btn);
    isRunning = false;
  }
}

function resetBtn(btn) {
  btn.classList.remove('progress');
  const fill = btn.querySelector('.btn-fill');
  if (fill) fill.remove();
  const btnText = btn.querySelector('.btn-text');
  if (btnText) btnText.textContent = 'Login';
  isPaused = false;
  isRunning = false;
  document.getElementById('bookmarkBtn').classList.remove('collapsed');
}

document.getElementById('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') handleBtnClick(); });
document.getElementById('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPw').focus(); });

const BOOKMARK_GAS_URL = 'https://script.google.com/macros/s/AKfycbzkKrp51oH_HSPPDhFXFpCFawJgOTO-v6plws-sfURXZvdTNBPGdkscqSN2uBBsfSJa/exec';

let bookmarkFormOpen = false;
let isBookmarkSubmitting = false;

function toggleBookmarkForm() {
  bookmarkFormOpen = !bookmarkFormOpen;
  const wrap = document.getElementById('bookmarkFormWrap');
  const btn = document.getElementById('bookmarkBtn');
  if (bookmarkFormOpen) {
    wrap.style.maxHeight = '400px';
    btn.classList.add('active');
    try {
      const lastRef = localStorage.getItem('bm_last_reference');
      if (lastRef) document.getElementById('bmReference').value = lastRef;
    } catch(e) {}
  } else {
    wrap.style.maxHeight = '0';
    btn.classList.remove('active');
  }
}

function generateTimestampId() {
  const now = new Date();
  const pad = (n, len) => String(n).padStart(len || 2, '0');
  return pad(now.getFullYear(), 4) + pad(now.getMonth() + 1) + pad(now.getDate())
       + '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
}

async function submitBookmark() {
  if (isBookmarkSubmitting) return;
  const msgEl = document.getElementById('bookmarkMsg');
  const submitBtn = document.getElementById('bookmarkSubmitBtn');
  msgEl.textContent = '';
  msgEl.className = '';

  const reference = document.getElementById('bmReference').value.trim();
  const pageFrom  = document.getElementById('bmPageFrom').value.trim();
  const pageTo    = document.getElementById('bmPageTo').value.trim();
  const sentence  = document.getElementById('bmSentence').value.trim();
  const comment   = document.getElementById('bmComment').value.trim();
  const hide      = '1';
  const id        = generateTimestampId();

  if (!reference && !pageFrom && !pageTo && !sentence && !comment) {
    msgEl.textContent = '하나 이상의 항목을 입력해주세요.';
    msgEl.className = 'bm-error';
    return;
  }

  isBookmarkSubmitting = true;

  msgEl.textContent = '저장 완료! (' + id + ')';
  msgEl.className = 'bm-success';
  try { localStorage.setItem('bm_last_reference', reference); } catch(e) {}
  document.getElementById('bmReference').value = '';
  document.getElementById('bmPageFrom').value = '';
  document.getElementById('bmPageTo').value = '';
  document.getElementById('bmSentence').value = '';
  document.getElementById('bmComment').value = '';

  const msgTimer = setTimeout(() => {
    msgEl.textContent = '';
    msgEl.className = '';
  }, 2000);

  isBookmarkSubmitting = false;

  const params = new URLSearchParams({
    action: 'addBookmark',
    id, hide, reference, pageFrom, pageTo, sentence, comment
  });
  const url = BOOKMARK_GAS_URL + '?' + params.toString();

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
    const r = await fetch(url, { signal: controller.signal, keepalive: true });
    clearTimeout(timer);
    const text = await r.text();
    const res = JSON.parse(text);
    if (!res.ok) {
      clearTimeout(msgTimer);
      msgEl.textContent = '저장 실패: ' + (res.error || '알 수 없는 오류') + ' — 다시 시도해주세요.';
      msgEl.className = 'bm-error';
    }
  } catch (e) {
    clearTimeout(msgTimer);
    msgEl.textContent = '서버 연결 오류 — 다시 시도해주세요.';
    msgEl.className = 'bm-error';
  }
}

let numpadTarget = null;
let numpadValue = '';

function updateNumpadDisplay() {
  const el = document.getElementById('numpadDisplay');
  if (numpadValue) { el.textContent = numpadValue; }
  else { el.innerHTML = '&nbsp;'; }
}

function openNumpad(inputEl) {
  numpadTarget = inputEl;
  numpadValue = inputEl.value;
  updateNumpadDisplay();
  document.getElementById('numpadLabel').textContent = inputEl.placeholder;
  document.getElementById('numpadOverlay').classList.add('show');
}

function numpadInput(ch) {
  numpadValue += ch;
  updateNumpadDisplay();
}

function numpadBack() {
  numpadValue = numpadValue.slice(0, -1);
  updateNumpadDisplay();
}

function numpadConfirm() {
  if (numpadTarget) numpadTarget.value = numpadValue;
  closeNumpad();
}

function closeNumpad() {
  document.getElementById('numpadOverlay').classList.remove('show');
  numpadTarget = null;
  numpadValue = '';
}

document.getElementById('bmPageFrom').addEventListener('focus', function(e) {
  e.target.blur();
  openNumpad(e.target);
});
document.getElementById('bmPageTo').addEventListener('focus', function(e) {
  e.target.blur();
  openNumpad(e.target);
});

/* ── Numpad: fast touch + click via event delegation ── */
(function() {
  const grid = document.querySelector('.numpad-grid');
  if (!grid) return;

  function handleBtn(btn) {
    if (!btn || !btn.dataset.np) return;
    const v = btn.dataset.np;
    if (v === 'back') numpadBack();
    else if (v === 'ok') numpadConfirm();
    else numpadInput(v);
  }

  /* touchend fires ~300ms faster than click on mobile */
  let touchHandled = false;
  grid.addEventListener('touchend', function(e) {
    const btn = e.target.closest('button[data-np]');
    if (!btn) return;
    e.preventDefault();          // suppress the delayed click
    touchHandled = true;
    btn.style.background = '';   // visual feedback reset
    handleBtn(btn);
  }, { passive: false });

  /* visual press feedback on touchstart */
  grid.addEventListener('touchstart', function(e) {
    const btn = e.target.closest('button[data-np]');
    if (btn && !btn.classList.contains('np-confirm')) {
      btn.style.background = '#e2e8f0';
    }
  }, { passive: true });

  /* fallback click for desktop / non-touch */
  grid.addEventListener('click', function(e) {
    if (touchHandled) { touchHandled = false; return; }
    handleBtn(e.target.closest('button[data-np]'));
  });

  /* close numpad when tapping overlay background */
  document.getElementById('numpadOverlay').addEventListener('touchend', function(e) {
    if (e.target === this) { e.preventDefault(); closeNumpad(); }
  }, { passive: false });
})();
</script>

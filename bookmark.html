<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REA LAB. Bookmark</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { overflow-y: scroll; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #f0f2f5;
  color: #2c3e50;
  min-height: 100vh;
}

.header {
  background: #fff;
  border-bottom: 1px solid #e2e6ea;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-title { font-size: 18px; font-weight: 800; color: #2c3e50; letter-spacing: -0.5px; }
.header-title span { font-size: 13px; font-weight: 400; color: #7ec8e3; margin-left: 6px; }
.count-label { font-size: 12px; color: #888; background: #f0f2f5; padding: 3px 10px; border-radius: 10px; }
.header-actions { display: flex; gap: 8px; }
.btn-refresh { background: #4a7dff; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-refresh:hover { background: #3a6ae0; }
.btn-refresh:disabled { opacity: .5; cursor: not-allowed; }
.btn-close { background: #e2e6ea; color: #555; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-close:hover { background: #d2d6da; }
.btn-sheet { background: #34a853; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-sheet:hover { background: #2d9249; }

.main-container { display: flex; height: calc(100vh - 49px); }
.panel-left { width: 50%; overflow-y: auto; border-right: 1px solid #e2e6ea; }
.panel-right { width: 50%; overflow: hidden; display: flex; flex-direction: column; }

.table-wrap { padding: 10px 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
thead th { background: #f7f8fa; padding: 11px 12px; text-align: center; font-size: 13px; font-weight: 700; color: #555; border-bottom: 2px solid #e2e6ea; white-space: nowrap; }
tbody tr { transition: background .15s; line-height: 1.8; }
tbody tr:hover { background: #f7f9fc; }
tbody tr.row-hidden td { color: #bbb; }
tbody td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f3;
  vertical-align: top; text-align: center; color: #000;
}
td.col-id { white-space: nowrap; width: 12%; }
td.col-ref { word-break: break-word; width: 16%; }
td.col-page { white-space: nowrap; width: 8%; }
td.col-sentence { width: 27%; word-break: break-word; text-align: left; }
td.col-comment { width: 27%; word-break: break-word; text-align: left; }
td.col-confirm { white-space: nowrap; width: 5%; }

.confirm-cb {
  -webkit-appearance: none; -moz-appearance: none; appearance: none;
  width: 16px; height: 16px; border: 1.5px solid #aaa; border-radius: 3px;
  background: #fff; cursor: pointer; position: relative; margin-top: 2px;
}
.confirm-cb:checked { background: #fff; border-color: #aaa; }
.confirm-cb:checked::after {
  content: '\2713'; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; color: #000; line-height: 1;
}

.ocr-panel {
  display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 12px;
}
.ocr-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.ocr-title { font-size: 15px; font-weight: 700; color: #2c3e50; }
.ocr-title span { font-size: 12px; font-weight: 400; color: #7ec8e3; margin-left: 6px; }
.btn-font-size { background: #e2e6ea; color: #555; border: none; border-radius: 6px; padding: 5px 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s; min-width: 28px; }
.btn-font-size:hover { background: #d2d6da; }
.btn-ocr-reset { background: #e2e6ea; color: #555; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-ocr-reset:hover { background: #d2d6da; }

.paste-zone {
  border: 2px dashed #c8cdd3; border-radius: 10px; background: #fafbfc;
  height: 45%; min-height: 160px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color .2s, background .2s;
  position: relative; overflow: hidden;
}
.paste-zone:hover { border-color: #4a7dff; background: #f0f4ff; }
.paste-zone.has-image {
  border-style: solid; border-color: #e2e6ea; cursor: default;
  overflow-y: auto; justify-content: flex-start;
}
.paste-zone.has-image:hover { border-color: #e2e6ea; background: #fafbfc; }
.paste-zone-text { color: #999; font-size: 13px; text-align: center; line-height: 1.6; pointer-events: none; }
.paste-zone-text .icon { font-size: 28px; display: block; margin-bottom: 6px; }
.paste-zone img {
  width: 100%; display: block; object-fit: contain; background: #f7f8fa; border-radius: 8px;
}
.paste-zone .btn-remove-img {
  position: sticky; top: 6px; float: right; margin: 6px 6px 0 0;
  width: 24px; height: 24px; background: rgba(0,0,0,.5); color: #fff;
  border: none; border-radius: 50%; font-size: 14px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
}
.paste-zone .btn-remove-img:hover { background: rgba(0,0,0,.7); }

.ocr-progress {
  display: none; background: #fff; border-radius: 8px; padding: 14px 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06); flex-shrink: 0;
}
.ocr-progress-bar { width: 100%; height: 6px; background: #e2e6ea; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.ocr-progress-fill { height: 100%; background: #4a7dff; border-radius: 3px; width: 0%; transition: width .3s; }

.ocr-result-wrap {
  flex: 1; display: none; flex-direction: column; min-height: 0;
}
.ocr-result {
  flex: 1; width: 100%; border: 1px solid #e2e6ea; border-radius: 8px;
  padding: 12px 3.5em; font-size: 17px; line-height: 1.8; color: #2c3e50;
  background: #fff; resize: none; outline: none; font-family: inherit;
  overflow-y: auto;
}
.ocr-result:focus { border-color: #4a7dff; }

.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; z-index: 999;
}
.loading-spinner { width: 32px; height: 32px; border: 3px solid #e2e6ea; border-top: 3px solid #4a7dff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 40px 20px; color: #a0aec0; font-size: 14px; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #2c3e50; color: #fff; padding: 8px 20px; border-radius: 6px;
  font-size: 13px; z-index: 1000; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">REA LAB. <span>Bookmark</span></div>
    <span class="count-label" id="countLabel">0</span>
  </div>
  <div class="header-actions">
    <button class="btn-sheet" onclick="window.open('https://docs.google.com/spreadsheets/d/1LmJe56gYTHnNSk7RCgBYRcVhL2o9cSvcJFklCrfQRVQ/edit?gid=0#gid=0','_blank')">Bookmark Sheet</button>
    <button class="btn-refresh" id="btnRefresh" onclick="loadBookmarks(true)">Refresh</button>
    <button class="btn-close" onclick="window.close()">Close</button>
  </div>
</div>

<div class="main-container">
  <div class="panel-left">
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Reference</th><th>Page</th><th>Sentence</th><th>Comment</th><th>Confirm</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">No bookmarks found.</div>
    </div>
  </div>

  <div class="panel-right">
    <div class="ocr-panel">
      <div class="ocr-header">
        <div class="ocr-title">OCR <span>Image to Text</span></div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="btn-font-size" onclick="changeOcrFontSize(-1)" title="글씨 줄이기">A-</button>
          <button class="btn-font-size" onclick="changeOcrFontSize(1)" title="글씨 키우기">A+</button>
          <button class="btn-ocr-reset" onclick="resetApiKey()" title="API 키 재설정">Key</button>
          <button class="btn-ocr-reset" onclick="clearOcr()">초기화</button>
        </div>
      </div>

      <div class="paste-zone" id="pasteZone" onclick="pasteFromClipboard()">
        <div class="paste-zone-text" id="pasteZoneText">
          <span class="icon">📋</span>
          클릭하여 이미지 붙여넣기<br>또는 Ctrl+V / Cmd+V
        </div>
        <img id="pasteImg" src="" alt="Preview" style="display:none">
        <button class="btn-remove-img" id="btnRemoveImg" onclick="event.stopPropagation(); clearOcr()" title="이미지 제거" style="display:none">✕</button>
      </div>

      <div class="ocr-progress" id="ocrProgress">
        <div class="ocr-progress-bar"><div class="ocr-progress-fill" id="progressFill"></div></div>
      </div>

      <div class="ocr-result-wrap" id="ocrResultWrap">
        <textarea class="ocr-result" id="ocrResult" placeholder="인식된 텍스트가 여기에 표시됩니다..."></textarea>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="loadingOverlay" class="loading-overlay" style="display:none"><div class="loading-spinner"></div></div>

<script>
const BOOKMARK_GAS_URL = 'https://script.google.com/macros/s/AKfycbzkKrp51oH_HSPPDhFXFpCFawJgOTO-v6plws-sfURXZvdTNBPGdkscqSN2uBBsfSJa/exec';

let allBookmarks = [];
let pastedImageData = null;

async function loadBookmarks(forceRefresh) {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  showLoading();
  if (!forceRefresh) {
    try {
      const cached = sessionStorage.getItem('realab_bookmarks');
      if (cached) {
        allBookmarks = JSON.parse(cached);
        sessionStorage.removeItem('realab_bookmarks');
        renderTable();
        toast('Loaded ' + allBookmarks.length + ' bookmarks (cached)');
        btn.disabled = false; hideLoading(); return;
      }
    } catch(e) {}
  }
  try {
    const url = BOOKMARK_GAS_URL + '?action=getBookmarks&t=' + Date.now();
    const res = await fetch(url);
    const json = await res.json();
    if (json.ok) { allBookmarks = json.bookmarks || []; renderTable(); toast('Loaded ' + allBookmarks.length + ' bookmarks'); }
    else { toast('Error: ' + (json.error || 'unknown'), 3000); }
  } catch(e) { toast('Network error: ' + e.message, 3000); }
  btn.disabled = false; hideLoading();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const emptyEl = document.getElementById('emptyState');
  const countEl = document.getElementById('countLabel');
  countEl.textContent = allBookmarks.length;
  if (allBookmarks.length === 0) { tbody.innerHTML = ''; emptyEl.style.display = ''; return; }
  emptyEl.style.display = 'none';

  const sorted = [...allBookmarks].sort((a, b) => {
    const aH = String(a.hide) !== '1', bH = String(b.hide) !== '1';
    if (aH !== bH) return aH ? 1 : -1;
    return !aH ? String(a.id).localeCompare(String(b.id)) : String(a.confirm_date||'').localeCompare(String(b.confirm_date||''));
  });

  let html = '';
  sorted.forEach((b) => {
    const isHidden = String(b.hide) !== '1';
    const rc = isHidden ? ' class="row-hidden"' : '';
    const ps = b.page_from ? (b.page_to ? b.page_from + ' ~ ' + b.page_to : String(b.page_from)) : '';
    html += '<tr' + rc + '>';
    html += '<td class="col-id">' + esc(b.id) + '</td>';
    html += '<td class="col-ref">' + esc(b.reference) + '</td>';
    html += '<td class="col-page">' + esc(ps) + '</td>';
    html += '<td class="col-sentence">' + esc(b.sentence) + '</td>';
    html += '<td class="col-comment">' + esc(b.comment) + '</td>';
    html += '<td class="col-confirm"><input type="checkbox" class="confirm-cb"' + (isHidden ? ' checked' : '') + ' onchange="toggleHide(\'' + esc(b.id) + '\', this.checked)" title="체크 시 숨김"></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function esc(s) { const d = document.createElement('div'); d.textContent = String(s||''); return d.innerHTML; }

function generateTimestampId() {
  const n = new Date();
  const p = (v) => String(v).padStart(2,'0');
  return n.getFullYear() + p(n.getMonth()+1) + p(n.getDate()) + '-' + p(n.getHours()) + p(n.getMinutes()) + p(n.getSeconds());
}

async function toggleHide(id, isNowChecked) {
  const newHide = isNowChecked ? '0' : '1';
  const cd = isNowChecked ? generateTimestampId() : '';
  showLoading();
  try {
    const url = BOOKMARK_GAS_URL + '?action=updateBookmarkHide&id=' + encodeURIComponent(id) + '&hide=' + encodeURIComponent(newHide) + '&confirm_date=' + encodeURIComponent(cd) + '&t=' + Date.now();
    const res = await fetch(url);
    const json = await res.json();
    if (json.ok) {
      const bm = allBookmarks.find(b => String(b.id) === String(id));
      if (bm) { bm.hide = newHide; bm.confirm_date = cd; }
      renderTable();
      toast(isNowChecked ? 'Hidden' : 'Visible');
    } else { toast('Error: ' + (json.error||''), 3000); }
  } catch(e) { toast('Network error: ' + e.message, 3000); }
  hideLoading();
}

async function pasteFromClipboard() {
  if (pastedImageData) return;
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      const imgType = item.types.find(t => t.startsWith('image/'));
      if (imgType) {
        const blob = await item.getType(imgType);
        loadImageBlob(blob);
        return;
      }
    }
    toast('클립보드에 이미지가 없습니다.', 2000);
  } catch(e) {
    toast('클립보드 접근 권한이 필요합니다. Ctrl+V로 붙여넣으세요.', 2500);
  }
}

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      e.preventDefault();
      loadImageBlob(items[i].getAsFile());
      return;
    }
  }
});

function loadImageBlob(blob) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    pastedImageData = ev.target.result;
    showPastedImage(pastedImageData);
    runOcr();
  };
  reader.readAsDataURL(blob);
}

function showPastedImage(imgUrl) {
  const zone = document.getElementById('pasteZone');
  document.getElementById('pasteZoneText').style.display = 'none';
  const img = document.getElementById('pasteImg');
  img.src = imgUrl;
  img.style.display = 'block';
  document.getElementById('btnRemoveImg').style.display = 'flex';
  zone.classList.add('has-image');
  document.getElementById('ocrResultWrap').style.display = 'none';
  document.getElementById('ocrProgress').style.display = 'none';
}

function getVisionApiKey() {
  return localStorage.getItem('gcv_api_key') || '';
}
function setVisionApiKey(key) {
  localStorage.setItem('gcv_api_key', key.trim());
}

async function runOcr() {
  if (!pastedImageData) return;

  let apiKey = getVisionApiKey();
  if (!apiKey) {
    apiKey = prompt('Google Cloud Vision API 키를 입력하세요.\n(한 번 입력하면 브라우저에 저장됩니다)');
    if (!apiKey || !apiKey.trim()) {
      toast('API 키가 필요합니다.', 2500);
      return;
    }
    setVisionApiKey(apiKey);
  }

  const progressEl = document.getElementById('ocrProgress');
  const progressFill = document.getElementById('progressFill');
  const resultWrap = document.getElementById('ocrResultWrap');
  const resultEl = document.getElementById('ocrResult');

  progressEl.style.display = 'block';
  resultWrap.style.display = 'none';
  progressFill.style.width = '30%';

  try {
    const base64Data = pastedImageData.split(',')[1];

    progressFill.style.width = '50%';

    const visionUrl = 'https://vision.googleapis.com/v1/images:annotate?key=' + apiKey;

    const response = await fetch(visionUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requests: [{
          image: { content: base64Data },
          features: [{ type: 'TEXT_DETECTION' }],
          imageContext: {
            languageHints: ['ko', 'en']
          }
        }]
      })
    });

    progressFill.style.width = '80%';

    if (!response.ok) {
      const errData = await response.json();
      throw new Error(errData.error?.message || 'API 요청 실패 (' + response.status + ')');
    }

    const data = await response.json();
    const annotation = data.responses[0];

    if (annotation.error) {
      throw new Error(annotation.error.message);
    }

    const rawText = annotation.fullTextAnnotation?.text || '';
    const text = mergeLines(rawText.trim());

    progressFill.style.width = '100%';

    setTimeout(() => {
      progressEl.style.display = 'none';
      resultWrap.style.display = 'flex';
      resultEl.value = text || '(인식된 텍스트가 없습니다)';

      if (text) toast('텍스트 인식 완료!');
      else toast('인식된 텍스트가 없습니다.', 2500);
    }, 200);
  } catch(e) {
    progressEl.style.display = 'none';
    if (e.message.includes('API key') || e.message.includes('API_KEY_INVALID') || e.message.includes('PERMISSION_DENIED')) {
      localStorage.removeItem('gcv_api_key');
      toast('API 키 오류: 키를 확인해주세요. 다시 시도하면 재입력할 수 있습니다.', 3000);
    } else if (e.message.includes('RESOURCE_EXHAUSTED') || e.message.includes('quota')) {
      toast('월 무료 한도(1,000건) 초과입니다.', 3000);
    } else {
      toast('OCR 오류: ' + e.message, 3000);
    }
  }
}

function mergeLines(raw) {
  const lines = raw.split('\n');
  const paragraphs = [];
  let current = '';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line === '') {
      if (current) { paragraphs.push(current); current = ''; }
      continue;
    }

    if (!current) {
      current = line;
    } else {
      const lastChar = current.charAt(current.length - 1);
      if (/[.?!。]$/.test(current) && /^[A-Z가-힣「\[]/.test(line)) {
        paragraphs.push(current);
        current = line;
      } else {
        current += ' ' + line;
      }
    }
  }
  if (current) paragraphs.push(current);

  return paragraphs.join('\n\n');
}

function resetApiKey() {
  localStorage.removeItem('gcv_api_key');
  toast('API 키가 초기화되었습니다. 다음 OCR 시 재입력합니다.', 2000);
}

function changeOcrFontSize(delta) {
  const ta = document.getElementById('ocrResult');
  let current = parseFloat(window.getComputedStyle(ta).fontSize);
  let newSize = Math.max(10, Math.min(32, current + delta));
  ta.style.fontSize = newSize + 'px';
}

function clearOcr() {
  pastedImageData = null;
  const zone = document.getElementById('pasteZone');
  document.getElementById('pasteZoneText').style.display = '';
  document.getElementById('pasteImg').style.display = 'none';
  document.getElementById('pasteImg').src = '';
  document.getElementById('btnRemoveImg').style.display = 'none';
  zone.classList.remove('has-image');
  document.getElementById('ocrProgress').style.display = 'none';
  document.getElementById('ocrResultWrap').style.display = 'none';
  document.getElementById('ocrResult').value = '';
}

function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }
let toastTimer;
function toast(msg, dur) {
  dur = dur || 1500;
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

window.addEventListener('DOMContentLoaded', () => { loadBookmarks(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>REA Lab</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:#fff;color:#333;font-size:14px}

/* ===== LAYOUT ===== */
.layout{display:flex;height:100vh;overflow:hidden}

/* ===== SIDEBAR ===== */
.sidebar{width:260px;min-width:260px;background:#fafbfc;border-right:1px solid #e2e6ea;overflow-y:auto;padding:8px 0;font-size:13px;user-select:none;display:flex;flex-direction:column}
.sidebar-top{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none}
.sidebar-top::-webkit-scrollbar{display:none}
.sidebar-bottom{padding:10px 12px;border-top:1px solid #e2e6ea}
.sidebar-bottom .btn-logout{width:100%;padding:9px 16px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;color:#555;font-weight:600;transition:all .15s}
.sidebar-bottom .btn-logout:hover{background:#f0f0f0;border-color:#aaa}

.tree-node{position:relative;cursor:pointer}
.tree-row{display:flex;align-items:center;padding:4px 10px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;margin:1px 6px;transition:background .12s}
.tree-row:hover{background:#e4ecf7}
.tree-row.active{background:#d0e0f5;font-weight:600}
.tree-toggle{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:#555;margin-right:1px}
.tree-toggle.has-children{cursor:pointer}
.tree-toggle.has-children::before{content:'▶';display:block;transition:transform .15s}
.tree-node.open>.tree-row .tree-toggle.has-children::before{transform:rotate(90deg)}
.tree-icon{width:18px;height:18px;flex-shrink:0;margin-right:5px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#333}
.tree-children{display:none;padding-left:12px;position:relative}
.tree-children::before{content:'';position:absolute;left:17px;top:0;bottom:8px;width:1px;background:#d8dce0}
.tree-node.open>.tree-children{display:block}
.tree-child-row{position:relative;padding-left:10px}
.tree-child-row::before{content:'';position:absolute;left:5px;top:12px;width:10px;height:1px;background:#d8dce0}
.tree-spacer{height:28px}
.tree-divider{height:16px}
.tree-menu-item{display:flex;align-items:center;padding:4px 8px 4px 12px;margin:2px 4px;border-radius:5px;cursor:pointer;color:#4a7dff;font-size:12px;font-weight:600;transition:background .12s}
.tree-menu-item:hover{background:#e4ecf7}

/* ===== MAIN AREA ===== */
.main{flex:1;overflow-y:scroll;padding:20px 28px;background:#fff}

/* ===== NEW CARD BUTTON ===== */
.btn-new-card-wrap{position:sticky;top:-20px;z-index:10;background:#fff;padding-top:20px;padding-bottom:16px;margin:-20px -28px 0;padding-left:28px;padding-right:28px}
.btn-new-card{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;background:linear-gradient(135deg,#8e9aaf 0%,#6b7b8d 100%);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;box-shadow:0 2px 8px rgba(107,123,141,.3)}
.btn-new-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(107,123,141,.4)}
.btn-new-card:active{transform:translateY(0)}

/* ===== CARD (collapsed) ===== */
.card{background:#fff;border:2px solid #a0aab5;border-radius:10px;margin-bottom:12px;overflow:hidden;transition:all .25s ease;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;z-index:1}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);border-color:#8090a0}
.card.expanded{box-shadow:0 4px 20px rgba(0,0,0,.12);border-color:#6b7b8d;background:#fff}
.card-header{display:flex;align-items:flex-start;padding:20px 20px;gap:14px;cursor:default}
.card-left{display:flex;align-items:baseline;gap:18px;flex:1;min-width:0;flex-wrap:wrap}
.card-id{font-weight:400;font-size:15px;color:#2c3e50;flex-shrink:0;letter-spacing:-.3px}
.card-breadcrumb{font-size:15px;color:#5a6a7a;word-break:break-word;line-height:1.5}
.card-breadcrumb span{font-weight:700;color:#34495e}
.card-apa{width:100%;color:#555;font-size:14px;margin-top:5px;line-height:1.6;word-break:break-word;padding-left:2em;text-indent:-2em}
.btn-open{flex:0 0 auto;align-self:flex-start;padding:8px 24px;border:1px solid #c0c8d0;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;transition:all .15s;color:#4a5568}
.btn-open:hover{background:#f0f4f8;border-color:#a0aab5;color:#2d3748}
.btn-cancel-new{flex:0 0 auto;align-self:flex-start;padding:8px 24px;border:1px solid #e53e3e;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;color:#e53e3e;transition:all .15s}
.btn-cancel-new:hover{background:#fff5f5;border-color:#c53030}

/* ===== CARD (expanded detail) ===== */
.card-detail{display:none;border-top:1px solid #e8ecf0;background:#f8f9fb;padding:0}
.card.expanded .card-detail{display:block}
.detail-body{display:flex;flex:1;min-height:520px}

/* detail center */
.detail-center{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.field-group label{display:block;font-weight:700;font-size:12px;color:#718096;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field-group input,.field-group textarea{width:100%;border:1px solid #d2d8e0;border-radius:8px;padding:10px 14px;font-size:15px;font-family:inherit;resize:vertical;background:#fff;line-height:1.6;transition:border-color .15s,box-shadow .15s;scrollbar-width:none;-ms-overflow-style:none;text-align:justify;overflow:hidden}
.field-group textarea::-webkit-scrollbar{display:none}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:#4a7dff;box-shadow:0 0 0 3px rgba(74,125,255,.12)}
.field-group input:read-only,.field-group textarea:read-only{background:#f1f3f5;color:#000;border-color:#e2e6ea}
.field-group textarea.tall{min-height:268px}
.field-group textarea.apa-short{min-height:52px}
.field-group textarea.medium{min-height:72px}
.field-group.comment-group{flex:1;display:flex;flex-direction:column}
.field-group.comment-group textarea{flex:1;min-height:120px}

/* detail right panel */
.detail-right{width:280px;min-width:280px;padding:16px;overflow-y:auto;background:#f8f9fb;display:flex;flex-direction:column}
.detail-right h4{font-size:11px;color:#a0aec0;margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}

/* category / element selector */
.cat-tree{margin-bottom:14px;overflow-y:auto;border:1px solid #d2d8e0;border-radius:8px;padding:8px;background:#fff;min-height:180px;max-height:392px}
.cat-tree .ct-cat{font-weight:700;font-size:13px;cursor:pointer;padding:4px 6px;display:flex;align-items:center;gap:4px;border-radius:4px;transition:background .12s}
.cat-tree .ct-cat:hover{background:#f0f4f8}
.cat-tree .ct-cat .plus-btn{margin-left:auto;width:22px;height:22px;border:1px solid #c0c8d0;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;color:#555;transition:all .12s}
.cat-tree .ct-cat .plus-btn:hover{background:#e8eef6;border-color:#4a7dff;color:#4a7dff}
.cat-tree .ct-elem{padding:3px 6px 3px 22px;font-size:12px;color:#555;cursor:pointer;border-radius:4px;transition:background .12s}
.cat-tree .ct-elem:hover{background:#e8eef6}
.cat-tree .ct-elem.selected{background:#d0ddf0;font-weight:600;color:#2d3748}
.cat-tree.locked{pointer-events:none;opacity:.55;scrollbar-width:none;-ms-overflow-style:none}
.cat-tree.locked::-webkit-scrollbar{display:none}
.cat-tree.locked .ct-cat,.cat-tree.locked .ct-elem{cursor:default}

/* cat dropdowns */
.cat-drop-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cat-drop-row select{flex:1;padding:6px 10px;border:1px solid #d2d8e0;border-radius:6px;font-size:12px;background:#fff;transition:border-color .15s}
.cat-drop-row select:focus{border-color:#4a7dff;outline:none}
.cat-drop-row select:disabled{background:#f1f3f5;color:#999;cursor:not-allowed}
.cat-drop-row .plus-btn{width:24px;height:24px;border:1px solid #c0c8d0;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#555;flex-shrink:0;transition:all .12s}
.cat-drop-row .plus-btn:hover{background:#e8eef6;border-color:#4a7dff;color:#4a7dff}
.cat-drop-row .plus-btn.locked{pointer-events:none;opacity:.4}

/* action buttons */
.detail-right-actions{display:flex;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid #e2e6ea;justify-content:space-between}
.detail-right-actions button{flex:1;padding:9px 0;border:1px solid #c0c8d0;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;text-align:center;transition:all .15s}
.detail-right-actions button:not(:last-child){margin-right:6px}
.detail-right-actions button:hover{background:#f0f4f8}
.detail-right-actions .btn-del{color:#e53e3e;border-color:#e53e3e}
.detail-right-actions .btn-del:hover{background:#fff5f5}
.detail-right-actions .btn-save{color:#fff;background:linear-gradient(135deg,#667eea,#5a67d8);border-color:transparent}
.detail-right-actions .btn-save:hover{background:linear-gradient(135deg,#5a67d8,#4c51bf)}

/* ===== CARD TOP CLOSE ===== */
.card-top-bar{display:flex;justify-content:flex-end;padding:8px 14px 0 14px}
.btn-close-top{background:none;border:none;font-size:18px;cursor:pointer;color:#a0aec0;padding:2px 8px;border-radius:5px;transition:all .12s}
.btn-close-top:hover{background:#e2e8f0;color:#4a5568}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(2px)}
.modal-box{background:#fff;border-radius:14px;padding:28px 32px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box.wide{width:680px}
.modal-box h3{margin-bottom:16px;font-size:18px;color:#2d3748;font-weight:700;cursor:grab;user-select:none}
.modal-box h3:active{cursor:grabbing}
.modal-box p{font-size:14px;color:#4a5568;margin-bottom:8px;line-height:1.6}
.modal-box label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px;margin-top:12px}
.modal-box input,.modal-box select{width:100%;padding:9px 12px;border:1px solid #d2d8e0;border-radius:8px;font-size:14px;margin-bottom:4px;transition:border-color .15s}
.modal-box input:focus,.modal-box select:focus{outline:none;border-color:#4a7dff;box-shadow:0 0 0 3px rgba(74,125,255,.12)}
.modal-breadcrumb{font-size:13px;color:#4a5568;margin-bottom:12px;line-height:1.5;padding:10px 14px;background:#f7f8fa;border-radius:8px;border:1px solid #e2e6ea}
.modal-breadcrumb span{font-weight:700}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.modal-btns button{padding:9px 24px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.modal-btns .btn-cancel{background:#edf2f7;color:#4a5568}
.modal-btns .btn-cancel:hover{background:#e2e8f0}
.modal-btns .btn-confirm{background:#4a7dff;color:#fff}
.modal-btns .btn-confirm:hover{background:#3a65d4}
.modal-btns .btn-danger{background:#e53e3e;color:#fff}
.modal-btns .btn-danger:hover{background:#c53030}


/* ===== LOADING OVERLAY ===== */
#loadingOverlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998}
.loading-content{text-align:center}
.loading-logo{font-size:32px;font-weight:800;color:#4a7dff;margin-bottom:24px;letter-spacing:-1px;transition:font-size .2s}
.loading-logo.action-msg{font-size:17px;font-weight:700;letter-spacing:0}
.loading-bar-track{width:280px;height:4px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:16px}
.loading-bar-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2,#667eea);background-size:200% 100%;border-radius:4px;animation:loadSlide 1.5s ease-in-out infinite;width:60%}
@keyframes loadSlide{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-steps{display:flex;flex-direction:column;gap:8px;align-items:center}
.loading-step{font-size:13px;color:#a0aec0;display:flex;align-items:center;gap:8px;transition:color .3s}
.loading-step.active{color:#4a7dff;font-weight:600}
.loading-step.done{color:#38a169}
.loading-step .step-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:12px}
.loading-step.active .step-icon{animation:pulse .8s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 30px;background:#2d3748;color:#fff;border-radius:10px;font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* ===== STATISTICS VIEW ===== */
.statistics-view{display:flex;gap:0;min-height:calc(100vh - 80px);overflow:hidden}
.statistics-left{flex:0 0 25%;max-width:25%;min-width:0;padding:24px;overflow-y:auto;border-right:1px solid #e2e6ea}
.statistics-right{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.statistics-right-header{padding:24px 24px 0 24px;flex-shrink:0}
.statistics-right-body{flex:1;overflow-y:auto;padding:0 24px 24px 24px}
.statistics-left h3{font-size:15px;font-weight:700;color:#2d3748;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #4a7dff}
.statistics-right-header h3{font-size:15px;font-weight:700;color:#2d3748;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #4a7dff}
.stat-tree{border:1px solid #d2d8e0;border-radius:8px;padding:10px;background:#fff}
.stat-tree .st-cat{font-weight:700;font-size:13px;padding:5px 8px;display:flex;align-items:baseline;gap:6px;border-radius:4px;color:#2d3748;cursor:pointer;transition:background .12s}
.stat-tree .st-cat:hover{background:#f0f4f8}
.stat-tree .st-cat .st-leader{flex:1;border-bottom:1px dotted #c0c8d0;min-width:12px;margin:0 4px;align-self:baseline;position:relative;top:-3px}
.stat-tree .st-cat .st-count{flex-shrink:0;font-size:11px;font-weight:600;color:#fff;background:#4a7dff;border-radius:10px;padding:1px 8px;min-width:22px;text-align:center}
.stat-tree .st-elem{padding:4px 8px 4px 28px;font-size:12px;color:#555;display:flex;align-items:baseline;gap:6px;border-radius:4px;transition:background .12s}
.stat-tree .st-elem:hover{background:#f0f4f8}
.stat-tree .st-elem .st-leader{flex:1;border-bottom:1px dotted #d2d8e0;min-width:12px;margin:0 4px;align-self:baseline;position:relative;top:-3px}
.stat-tree .st-elem .st-count{flex-shrink:0;font-size:11px;font-weight:500;color:#4a7dff;background:#edf2f7;border-radius:10px;padding:1px 7px;min-width:20px;text-align:center}
.stat-tree .st-children{display:none}
.stat-tree .st-node.open>.st-children{display:block}
.stat-tree .st-toggle{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#a0aec0;flex-shrink:0;transition:transform .15s}
.stat-tree .st-node.open>.st-cat>.st-toggle{transform:rotate(90deg)}
.apa-list{list-style:none;padding:0;margin:0}
.apa-list li{padding:10px 12px;font-size:15px;line-height:1.7;color:#2d3748;border-bottom:1px solid #f0f2f5;padding-left:6em;text-indent:-6em;word-break:break-word}
.apa-list li:last-child{border-bottom:none}
.apa-list li.apa-highlight{font-weight:700;background:#f0f4ff}
.apa-count-badge{display:inline-block;font-size:12px;font-weight:600;color:#888;margin-left:8px}
.st-name{cursor:pointer;border-radius:3px;padding:1px 3px;transition:background .12s,color .12s}
.st-name:hover{background:#e8eef6;color:#4a7dff}
.st-name.st-name-active{background:#4a7dff;color:#fff;border-radius:4px}

/* ===== PRINT ===== */
@page{size:letter;margin:20mm 15mm 15mm 15mm}
@media print{
  .sidebar,.btn-open,.btn-cancel-new,.detail-right-actions,.btn-new-card-wrap,.btn-new-card,.toast,.card-top-bar,.card-date-wrap,.statistics-view{display:none!important}
  .card-date-info{display:none!important}
  .layout{display:block!important}
  .main{padding:0!important;overflow:visible!important;height:auto!important;max-height:none!important}
  .layout{height:auto!important;overflow:visible!important}
  .card:not(.expanded){display:none!important}
  .card.expanded{break-inside:auto!important;border:none!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;margin:0!important;height:auto!important;max-height:none!important}
  .card{overflow:visible!important}
  .card-header{padding:0!important;position:relative!important;border:none!important}
  .card-left{flex-wrap:wrap!important}
  /* Note ID and breadcrumb above the content area */
  .card-id{display:block!important;width:100%!important;font-size:11px!important;color:#555!important;padding:0 0 0 0!important;order:-2!important;text-align:right!important}
  .card-breadcrumb{display:block!important;width:100%!important;font-size:13px!important;color:#000!important;padding:0 0 13px 0!important;margin:0!important;order:-1!important}
  .card-breadcrumb span{font-weight:600!important}
  .card-apa-row{padding:0!important}
  .card-apa{color:#000!important;font-size:13px!important;font-weight:normal!important;padding:0 0 12px 2em!important;text-indent:-2em!important}
  .card-detail{display:block!important;border:none!important}
  .detail-right{display:none!important}
  .field-group textarea.apa-short{display:none!important}
  .print-hide-apa{display:none!important}
  .detail-center{width:100%!important;max-width:100%!important;padding:8px 0!important;overflow:visible!important}
  .detail-body{display:block!important;overflow:visible!important;min-height:0!important;border:none!important}
  .detail-center .field-group textarea{width:100%!important;min-width:100%!important;font-size:11px!important;line-height:1.6!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;overflow-wrap:break-word!important;word-wrap:break-word!important;resize:none!important;border:none!important;background:#fff!important;box-shadow:none!important;padding:4px 0!important;color:#000!important;display:block!important;white-space:pre-wrap!important;text-align:justify!important}
  .detail-center .field-group textarea[data-field="text"]{font-family:inherit!important;font-style:normal!important;font-size:11px!important;padding-left:5em!important;padding-right:5em!important;border:none!important}
  .detail-center .field-group textarea[data-field="context"],.detail-center .field-group textarea[data-field="comment"]{text-indent:1em!important}
  .detail-center .field-group textarea[data-field="text"]{text-indent:1em!important}
  .detail-center .field-group{border:none!important;background:#fff!important;margin-bottom:4px!important;overflow:visible!important;page-break-inside:auto!important}
  .detail-center .field-group label{font-size:10px!important;margin-bottom:2px!important}
  .card-detail,.detail-body,.detail-center,.detail-center .field-group{overflow:visible!important}
  .card.expanded .card-detail{background:#fff!important;border:none!important}
  /* Print mirrors replace textareas to avoid clipping */
  .print-ready .detail-center .field-group textarea{display:none!important}
  .print-ready .detail-center .field-group .print-mirror{display:block!important;width:100%!important;font-size:11px!important;line-height:1.6!important;white-space:pre-wrap!important;word-wrap:break-word!important;overflow-wrap:break-word!important;color:#000!important;background:#fff!important;border:none!important;padding:4px 0!important;margin:0!important;font-family:inherit!important;text-indent:1em!important;text-align:justify!important}
  .print-ready .detail-center .field-group .print-mirror[data-field="text"]{font-family:inherit!important;font-style:normal!important;font-size:11px!important;padding-left:5em!important;padding-right:5em!important;border:none!important;text-indent:1em!important}
  /* Print page number footer */
  .print-page-footer{display:none!important}
  /* Remove all remaining borders */
  *{border-color:transparent!important}
}
</style>
</head>
<body>

<!-- ===== LOADING ===== -->
<div id="loadingOverlay" style="display:none">
  <div class="loading-content">
    <div class="loading-logo">REA Lab</div>
    <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
    <div class="loading-steps">
      <div class="loading-step" id="ls1"><span class="step-icon">○</span> 서버 연결 중</div>
      <div class="loading-step" id="ls2"><span class="step-icon">○</span> 카테고리 불러오는 중</div>
      <div class="loading-step" id="ls3"><span class="step-icon">○</span> 카드 데이터 로딩 중</div>
      <div class="loading-step" id="ls4"><span class="step-icon">○</span> 화면 구성 중</div>
    </div>
  </div>
</div>

// ===== Logout =====
function doLogout() {
  showConfirmModal('로그아웃', '로그아웃 하시겠습니까?', '로그아웃', () => {
    const LOGOUT_STEPS = [
      '사용자 인증 정보 해제',
      'Preload Cache Data 삭제',
      'Category Data 정리',
      'Element Data 정리',
      'Serge Card Data 정리',
      'Link Data 정리',
      'Session Storage 초기화',
      '3초 후 Log-in 페이지로 이동'
    ];
    const TOTAL = LOGOUT_STEPS.length;

    let stepsHtml = LOGOUT_STEPS.map((s, i) =>
      `<div class="lo-step" id="lo${i+1}">
        <span class="lo-dot"></span>
        <span style="line-height:1.5">${s}</span>
        ${i < TOTAL - 1 ? '<span style="position:absolute;left:7px;top:18px;width:1.5px;height:100%;background:#e5e7eb"></span>' : ''}
      </div>`
    ).join('');

    const html = `
      <div class="modal-overlay" style="pointer-events:none">
        <div class="modal-box" style="text-align:left;width:360px">
          <h3 style="cursor:default;text-align:center;font-size:18px;margin-bottom:18px">로그아웃 하는 중...</h3>
          <div id="loSteps">${stepsHtml}</div>
        </div>
      </div>`;
    document.getElementById('modalContainer').innerHTML = html;

    // CSS for step states (injected once)
    if (!document.getElementById('logoutStepStyles')) {
      const style = document.createElement('style');
      style.id = 'logoutStepStyles';
      style.textContent = `
        .lo-step{display:flex;align-items:center;font-size:12.5px;color:#cbd5e0;position:relative;padding-left:24px;min-height:26px;transition:color .3s}
        .lo-dot{position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;transition:all .3s;z-index:1}
        .lo-step.active{color:#4a7dff !important;font-weight:600}
        .lo-step.active .lo-dot{border-color:#4a7dff !important;background:#4a7dff !important;box-shadow:0 0 0 3px rgba(74,125,255,.15)}
        .lo-step.done{color:#9ca3af}
        .lo-step.done .lo-dot{border-color:#9ca3af;background:#9ca3af;box-shadow:none}
        .lo-step.countdown{color:#4a7dff !important;font-weight:700}
        .lo-step.countdown .lo-dot{border-color:#4a7dff !important;background:#4a7dff !important;box-shadow:0 0 0 3px rgba(74,125,255,.15)}
      `;
      document.head.appendChild(style);
    }

    function setLoStep(n) {
      for (let i = 1; i <= TOTAL; i++) {
        const el = document.getElementById('lo' + i);
        if (!el) continue;
        const dot = el.querySelector('.lo-dot');
        el.classList.remove('active', 'done');
        dot.textContent = '';
        if (i < n) {
          el.classList.add('done');
          dot.textContent = '✓';
          dot.style.color = '#fff';
          dot.style.fontSize = '8px';
          dot.style.fontWeight = '700';
        } else if (i === n) {
          el.classList.add('active');
        }
      }
    }

    async function runLogout() {
      const delay = ms => new Promise(r => setTimeout(r, ms));

      // Step 1: 사용자 인증 정보 해제
      setLoStep(1);
      sessionStorage.removeItem('realab_user');
      currentUser = null;
      await delay(400);

      // Step 2: Preload 캐시 데이터 삭제
      setLoStep(2);
      sessionStorage.removeItem('realab_preload');
      await delay(350);

      // Step 3: 카테고리 데이터 정리
      setLoStep(3);
      DB.categories = [];
      await delay(300);

      // Step 4: Element 데이터 정리
      setLoStep(4);
      DB.elements = [];
      await delay(300);

      // Step 5: Serge Card 데이터 정리
      setLoStep(5);
      DB.srgData = [];
      await delay(350);

      // Step 6: 링크 데이터 정리
      setLoStep(6);
      if (DB.links) DB.links = [];
      await delay(300);

      // Step 7: 세션 스토리지 초기화
      setLoStep(7);
      try { sessionStorage.clear(); } catch(e) {}
      await delay(350);

      // Steps 1~7 done, now step 8: countdown
      // Mark 1~7 as done
      for (let i = 1; i <= 7; i++) {
        const el = document.getElementById('lo' + i);
        const dot = el ? el.querySelector('.lo-dot') : null;
        if (el) { el.classList.remove('active'); el.classList.add('done'); }
        if (dot) { dot.textContent = '✓'; dot.style.color = '#fff'; dot.style.fontSize = '8px'; dot.style.fontWeight = '700'; }
      }

      // Step 8: 3초 카운트다운
      const step8 = document.getElementById('lo' + TOTAL);
      const step8Label = step8 ? step8.querySelector('span:nth-child(2)') : null;
      const step8Dot = step8 ? step8.querySelector('.lo-dot') : null;
      step8.classList.remove('active');
      step8.classList.add('countdown');
      if (step8Dot) { step8Dot.textContent = '3'; step8Dot.style.color = '#fff'; step8Dot.style.fontSize = '9px'; step8Dot.style.fontWeight = '700'; }
      if (step8Label) step8Label.textContent = '3초 후 로그인 페이지로 이동';

      await delay(1000);
      if (step8Dot) step8Dot.textContent = '2';
      if (step8Label) step8Label.textContent = '2초 후 로그인 페이지로 이동';

      await delay(1000);
      if (step8Dot) step8Dot.textContent = '1';
      if (step8Label) step8Label.textContent = '1초 후 로그인 페이지로 이동';

      await delay(1000);

      // Final: mark all done
      step8.classList.remove('countdown');
      step8.classList.add('done');
      if (step8Dot) { step8Dot.textContent = '✓'; step8Dot.style.fontSize = '8px'; }
      if (step8Label) step8Label.textContent = '로그인 페이지로 이동';

      const h3 = document.querySelector('#modalContainer .modal-box h3');
      if (h3) { h3.textContent = '로그아웃 완료'; h3.style.color = '#9ca3af'; }

      await delay(300);
      window.location.href = 'index.html';
    }

    runLogout();
  });
}

}
function setLoadStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('ls' + i);
    if (i < n) {
      el.className = 'loading-step done';
      el.querySelector('.step-icon').textContent = '✓';
    } else if (i === n) {
      el.className = 'loading-step active';
      el.querySelector('.step-icon').textContent = '●';
    } else {
      el.className = 'loading-step';
      el.querySelector('.step-icon').textContent = '○';
    }
  }
}

// ===== GAS fetch helpers (with retry) =====
async function gasFetch(url, options, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const r = await fetch(url, options);
      const text = await r.text();
      try { return JSON.parse(text); }
      catch(_) { throw new Error('서버 응답 파싱 오류'); }
    } catch(e) {
      if (attempt < retries) { await new Promise(r => setTimeout(r, 800)); continue; }
      throw e;
    }
  }
}
async function gasGet(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  return gasFetch(url, {});
}
async function gasPost(body) {
  return gasFetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  });
}

// ===== Load all data =====
async function loadAll() {
  showLoading();
  try {
    let res = null;

    // Check for pre-loaded data from login page
    try {
      const preload = sessionStorage.getItem('realab_preload');
      if (preload) {
        sessionStorage.removeItem('realab_preload');
        res = JSON.parse(preload);
      }
    } catch(_) {}

    // If no pre-loaded data, fetch from server
    if (!res) {
      setLoadStep(1);
      setLoadStep(2);
      res = await gasGet({ action: 'getAll' });
    }

    setLoadStep(3);
    if (res.ok) {
      DB = res;
      if (!DB.links) DB.links = [];
      // Normalize "no." header to "no" (sheet header has period)
      DB.links = DB.links.map(l => {
        if (l['no.'] !== undefined && l.no === undefined) { l.no = l['no.']; }
        return l;
      });
      setLoadStep(4);
      buildSidebar();
      renderCards();
      document.getElementById('appLayout').style.display = 'flex';
    } else {
      toast('데이터 로드 실패: ' + (res.error || ''), 3000);
    }
  } catch (e) {
    toast('서버 오류: ' + e.message, 3000);
  }
  hideLoading();
}

function formatApa(raw) {
  let s = escHtml(raw);
  // 영어 이탤릭 제목: 마침표 뒤 공백 후 대문자로 시작하는 영어 제목 (마침표나 괄호 전까지)
  // Book title pattern: after ".). " or "). " — English title before ". " or " ("
  s = s.replace(/((?:\(\d{4}[a-z]?\)\.\s|(?:Ed|Eds)\.\)\.\s))([A-Z][^.]+?)(\.|\s\()/g, function(m, pre, title, after) {
    return pre + '<i>' + title + '</i>' + after;
  });
  // 한글 제목 굵게: 괄호+년도+마침표 뒤 한글로 시작하는 제목
  s = s.replace(/((?:\(\d{4}[a-z]?\)\.\s))([가-힣][^.]+?)(\.)/g, function(m, pre, title, after) {
    return pre + '<b>' + title + '</b>' + after;
  });
  // 영문 논문: 저널명, 권수(호수) — 저널명+권수 이탤릭
  s = s.replace(/(\.\s)([A-Z][A-Za-z\s&:]+),\s(\d+)(\(\d+\))?/g, function(m, dot, journal, vol, issue) {
    return dot + '<i>' + journal + ', ' + vol + '</i>' + (issue || '');
  });
  // 한글 논문: 저널명, 권수(호수) — 저널명+권수 이탤릭
  s = s.replace(/(\.\s)([가-힣][가-힣\s&]+),\s(\d+)(\(\d+\))?/g, function(m, dot, journal, vol, issue) {
    return dot + '<i>' + journal + ', ' + vol + '</i>' + (issue || '');
  });
  return s;
}

function renderStatistics() {
  const container = document.getElementById('statisticsView');

  // ===== LEFT PANEL: Category/Element tree with counts =====
  let leftHtml = '<h3>📂 Card Statistics</h3>';
  leftHtml += '<div class="stat-tree">';

  // Build ordered categories: 00_기타 (category_99) first, then the rest
  const otherCat = DB.categories.find(c => c.category_id === 'category_99');
  const regularCats = DB.categories.filter(c => c.category_id !== 'category_99');
  const orderedCats = otherCat ? [otherCat, ...regularCats] : regularCats;

  orderedCats.forEach(cat => {
    const catCode = cat.category_id.replace('category_', '');
    const displayName = catCode + '_' + cat.category_name;
    const elems = getElementsForCategory(cat.category_id);
    const catCount = DB.srgData.filter(d => d.category_id === cat.category_id).length;
    const hasChildren = elems.length > 0;

    leftHtml += '<div class="st-node open">';
    leftHtml += '<div class="st-cat" onclick="this.parentElement.classList.toggle(\'open\')">';
    if (hasChildren) {
      leftHtml += '<span class="st-toggle">▶</span>';
    } else {
      leftHtml += '<span class="st-toggle" style="visibility:hidden">▶</span>';
    }
    leftHtml += '<span class="st-name" onclick="event.stopPropagation();highlightApaByFilter(\'category\',\'' + cat.category_id + '\',this)">' + escHtml(displayName) + '</span>';
    if (catCount > 0) {
      leftHtml += '<span class="st-leader"></span>';
      leftHtml += '<span class="st-count">' + catCount + '건</span>';
    }
    leftHtml += '</div>';

    if (hasChildren) {
      leftHtml += '<div class="st-children">';
      elems.forEach(elem => {
        const elemCode = elem.element_id.replace('element_', '');
        const elemCount = DB.srgData.filter(d => d.element_id === elem.element_id).length;
        leftHtml += '<div class="st-elem">';
        leftHtml += '<span class="st-name" onclick="highlightApaByFilter(\'element\',\'' + elem.element_id + '\',this)">' + elemCode + '_' + escHtml(elem.element_name) + '</span>';
        if (elemCount > 0) {
          leftHtml += '<span class="st-leader"></span>';
          leftHtml += '<span class="st-count">' + elemCount + '건</span>';
        }
        leftHtml += '</div>';
      });
      leftHtml += '</div>';
    }
    leftHtml += '</div>';
  });

  leftHtml += '</div>';

  // ===== RIGHT PANEL: Unique APA references =====
  // Collect unique APAs, filter empty, sort ascending
  const apaSet = new Set();
  DB.srgData.forEach(d => {
    const apa = (d.apa || '').trim();
    if (apa) apaSet.add(apa);
  });
  const apaList = [...apaSet].sort((a, b) => a.localeCompare(b, 'ko'));

  let rightHeaderHtml = '<h3>📚 참고문헌 (APA)</h3>';

  let rightBodyHtml = '<ul class="apa-list" id="statApaList">';
  apaList.forEach((apa, idx) => {
    rightBodyHtml += '<li data-apa="' + escHtml(apa) + '">' + formatApa(apa) + '</li>';
  });
  if (apaList.length === 0) {
    rightBodyHtml += '<li style="color:#a0aec0;text-indent:0;padding-left:12px">참고문헌이 없습니다.</li>';
  }
  rightBodyHtml += '</ul>';

  container.innerHTML = '<div class="statistics-view">' +
    '<div class="statistics-left">' + leftHtml + '</div>' +
    '<div class="statistics-right">' +
      '<div class="statistics-right-header">' + rightHeaderHtml + '</div>' +
      '<div class="statistics-right-body">' + rightBodyHtml + '</div>' +
    '</div>' +
    '</div>';
}
function highlightApaByFilter(type, id, clickedEl) {
  // Toggle active state on clicked name
  const allNames = document.querySelectorAll('.stat-tree .st-name');
  const wasActive = clickedEl.classList.contains('st-name-active');
  allNames.forEach(n => n.classList.remove('st-name-active'));

  const list = document.getElementById('statApaList');
  if (!list) return;
  const items = list.querySelectorAll('li[data-apa]');

  if (wasActive) {
    // Deselect: remove all highlights
    items.forEach(li => li.classList.remove('apa-highlight'));
    return;
  }

  clickedEl.classList.add('st-name-active');

  // Collect APAs for this category or element
  const matchingApas = new Set();
  DB.srgData.forEach(d => {
    const match = type === 'category' ? d.category_id === id : d.element_id === id;
    if (match) {
      const apa = (d.apa || '').trim();
      if (apa) matchingApas.add(apa);
    }
  });

  items.forEach(li => {
    const apaVal = li.getAttribute('data-apa');
    if (matchingApas.has(apaVal)) {
      li.classList.add('apa-highlight');
    } else {
      li.classList.remove('apa-highlight');
    }
  });
}

// ===== Helpers =====
function getCategoryName(catId) {
  const c = DB.categories.find(c => c.category_id === catId);
  return c ? c.category_name : catId;
}
function getElementName(elemId) {
  const e = DB.elements.find(e => e.element_id === elemId);
  return e ? e.element_name : elemId;
}
function getElementsForCategory(catId) {
  return DB.elements.filter(e => e.category === catId);
}

function generateNextSrgId() {
  let maxNum = 0;
  DB.srgData.forEach(d => {
    const m = String(d.srg_id).match(/srg_(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
  });
  return 'srg_' + String(maxNum + 1).padStart(5, '0');
}
function generateNextCategoryId() {
  let maxNum = 0;
  DB.categories.forEach(c => {
    if (c.category_id === 'category_99') return;
    const m = String(c.category_id).match(/category_(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
  });
  return 'category_' + String(maxNum + 1).padStart(2, '0');
}
function generateNextElementId(catId) {
  const catCode = catId.replace('category_', '');
  const prefix = 'element_' + catCode + '-';
  const existing = DB.elements.filter(e => e.category === catId);
  if (existing.length === 0) return prefix + '00';
  let maxSub = -1;
  existing.forEach(e => {
    const m = String(e.element_id).match(/element_\d+-(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxSub) maxSub = n; }
  });
  return prefix + String(maxSub + 1).padStart(2, '0');
}
function generateNextLinkNo() {
  let maxNum = 0;
  (DB.links || []).forEach(l => {
    const n = parseInt(l.no, 10);
    if (!isNaN(n) && n > maxNum) maxNum = n;
  });
  return String(maxNum + 1);
}

// ===== Modal helpers =====
function showModal(html) {
  document.getElementById('modalContainer').innerHTML = html;
  // Setup drag-safe overlay dismiss (click only, not drag)
  const overlay = document.querySelector('#modalContainer .modal-overlay');
  if (overlay) {
    let overlayMouseDownTarget = null;
    overlay.addEventListener('mousedown', e => { overlayMouseDownTarget = e.target; });
    overlay.addEventListener('mouseup', e => {
      if (e.target === overlay && overlayMouseDownTarget === overlay) closeModal();
      overlayMouseDownTarget = null;
    });
  }
  // Setup draggable modal from h3
  const box = document.querySelector('#modalContainer .modal-box');
  const h3 = box ? box.querySelector('h3') : null;
  if (box && h3) {
    let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    box.style.position = 'relative';
    box.style.left = '0px';
    box.style.top = '0px';
    h3.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseInt(box.style.left) || 0;
      origTop = parseInt(box.style.top) || 0;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function modalDrag(e) {
      if (!isDragging) return;
      box.style.left = (origLeft + e.clientX - startX) + 'px';
      box.style.top = (origTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', function modalDragEnd() {
      isDragging = false;
    });
  }
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function showConfirmModal(title, message, confirmText, onConfirm, btnClass = 'btn-confirm') {
  const html = `
    <div class="modal-overlay">
      <div class="modal-box">

const LINK_ICONS = [
  { value: '🌐', label: '인터넷 사이트' },
  { value: '📊', label: '구글 시트' },
  { value: '📝', label: '구글 독스' },

  { value: '📰', label: '뉴스/블로그' },

  { value: '📚', label: '도서관/자료' },
  { value: '🔬', label: '연구/논문' },
  { value: '💻', label: '개발/코딩' },
  { value: '📧', label: '이메일' },
  { value: '🗂️', label: '데이터베이스' },
  { value: '📹', label: '영상/미디어' },
];
function renderIconSelector(containerId, selectedIcon) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;margin-bottom:8px';
  LINK_ICONS.forEach(ic => {
    const div = document.createElement('div');
    div.textContent = ic.value;
    div.title = ic.label;
    div.dataset.icon = ic.value;
    const isSel = selectedIcon === ic.value;
    div.style.cssText = 'width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid ' + (isSel ? '#4a7dff' : '#e2e6ea') + ';border-radius:8px;cursor:pointer;font-size:20px;background:' + (isSel ? '#eef3ff' : '#fff') + ';transition:all .12s';
    div.addEventListener('click', function() {
      document.getElementById('modalLinkIcon').value = ic.value;
      wrap.querySelectorAll('div').forEach(function(d) { d.style.borderColor = '#e2e6ea'; d.style.background = '#fff'; });
      div.style.borderColor = '#4a7dff';
      div.style.background = '#eef3ff';
    });
    wrap.appendChild(div);
  });
  container.appendChild(wrap);
}

  window._reorderLinks = links.map(l => ({ no: l.no, site_name: l.site_name, url: l.url, icon: l.icon || '' }));
  renderReorderModal();
}
function renderReorderModal() {
  const items = window._reorderLinks;
  let listHtml = '';
  items.forEach((item, idx) => {
    listHtml += `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${idx % 2 === 0 ? '#f7f8fa' : '#fff'};border-radius:6px;margin-bottom:4px">`;
    listHtml += `<span style="font-weight:700;color:#4a7dff;min-width:28px">${idx + 1}</span>`;
    listHtml += `<span style="flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(item.site_name)}</span>`;
    listHtml += `<button onclick="reorderLinkMove(${idx},-1)" style="width:28px;height:28px;border:1px solid #d2d8e0;border-radius:5px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center"${idx === 0 ? ' disabled style="opacity:.3;cursor:not-allowed"' : ''}>▲</button>`;
    listHtml += `<button onclick="reorderLinkMove(${idx},1)" style="width:28px;height:28px;border:1px solid #d2d8e0;border-radius:5px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center"${idx === items.length - 1 ? ' disabled style="opacity:.3;cursor:not-allowed"' : ''}>▼</button>`;
    listHtml += `</div>`;
  });
  const html = `
    <div class="modal-overlay">
      <div class="modal-box wide">
        <h3>🔗 Link 순서 관리</h3>
        <div style="max-height:400px;overflow-y:auto;margin-bottom:8px">${listHtml}</div>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">취소</button>
          <button class="btn-confirm" onclick="doReorderLinks()">저장</button>
        </div>
      </div>
    </div>`;
  showModal(html);
}
function reorderLinkMove(idx, dir) {
  const items = window._reorderLinks;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
  renderReorderModal();
}
async function doReorderLinks() {
  const items = window._reorderLinks;
  closeModal(); showLoading('순서 변경 중...');
  try {
    const res = await gasPost({ action: 'reorderLinks', links: items });
    if (res.ok) {
      DB.links = items.map((l, i) => ({ no: String(i + 1), site_name: l.site_name, url: l.url, icon: l.icon || '' }));
      buildSidebar();
      toast('순서 변경 완료!');
    } else { toast('순서 변경 실패: ' + (res.error || ''), 3000); }
  } catch(e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

// ===== Add Cat-0x item Modal =====
function openAddCatItemModal(srgId, catKey) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  const catId = d.category_id;
  const elemId = d.element_id;
  if (!catId && !elemId) { showAlertModal('알림', '먼저 Category / Element를 선택하세요.'); return; }
  const breadcrumb = makeBreadcrumb(d);
  const html = `
    <div class="modal-overlay">
      <div class="modal-box wide">
        <h3>${catKey} 항목 추가</h3>
        <div class="modal-breadcrumb">${breadcrumb}</div>
        <label>${catKey} 값</label>
        <input type="text" id="modalCatItemVal" placeholder="값을 입력하세요">
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">취소</button>
          <button class="btn-confirm" onclick="doAddCatItem('${srgId}','${catKey}','${catId}','${elemId}')">추가</button>
        </div>
      </div>
    </div>`;
  showModal(html);
  setTimeout(() => document.getElementById('modalCatItemVal').focus(), 100);
}
async function doAddCatItem(srgId, catKey, catId, elemId) {
  const val = document.getElementById('modalCatItemVal').value.trim();
  if (!val) { toast('값을 입력하세요.'); return; }
  closeModal(); showLoading('항목 추가 중...');
  try {
    const res = await gasPost({ action: 'addCatItem', catKey, value: val, category_id: catId, element_id: elemId });
    if (res.ok) {
      // Update local: find matching card or add value to current card
      const card = DB.srgData.find(d => d.srg_id === srgId);
      if (card) {
        const existing = (card[catKey] || '').trim();
        card[catKey] = existing ? existing + ', ' + val : val;
      }
      renderCards();
      toast('항목 추가 완료!');
    } else { toast('추가 실패: ' + (res.error || ''), 3000); }
  } catch(e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function toggleCatTree(event, catId) {
  event.stopPropagation();
  openCategories[catId] = !openCategories[catId];
  buildSidebar();
}
function onCatClick(event, catId, hasChildren) {
  if (catId === 'category_99' || catId === '__catMgmt__' || catId === '__linkMgmt__' || catId === '__elemMgmt__') {
    openCategories[catId] = !openCategories[catId];
    buildSidebar();
    return;
  }
  // If already filtered to this category and it's open, toggle closed
  if (hasChildren && currentFilter && currentFilter.type === 'category' && currentFilter.id === catId && openCategories[catId]) {
    openCategories[catId] = false;
    buildSidebar();
    return;
  }
  if (hasChildren) openCategories[catId] = !openCategories[catId];
  filterCategory(catId); // guard is inside filterCategory
}

// ===== Edit guard =====
function isEditingCard() {
  // Check if any new card exists or any card is in modify mode
  const hasNewCard = DB.srgData.some(d => String(d.srg_id).startsWith('NEW_'));
  const hasModify = Object.keys(modifyModeCards).length > 0;
  return hasNewCard || hasModify;
}
function guardedNavigate(action) {
  if (isEditingCard()) {
    showConfirmModal('편집 중', '작성 중인 내용이 있습니다. 이동하시겠습니까?\n변경 사항은 저장되지 않습니다.', '이동', () => {
      // Discard new cards and modify modes
      DB.srgData = DB.srgData.filter(d => !String(d.srg_id).startsWith('NEW_'));
      modifyModeCards = {};
      document.getElementById('btnNewCardWrap').style.display = '';
      action();
    });
  } else {
    action();
  }
}

// ===== Filters =====
function filterAll() {
  guardedNavigate(() => {
    currentFilter = null; expandedCardId = null; modifyModeCards = {};
    showCardsView();
    buildSidebar();
  });
}
function filterCategory(catId) {
  guardedNavigate(() => {
    currentFilter = { type: 'category', id: catId }; expandedCardId = null; modifyModeCards = {};
    showCardsView();
    buildSidebar();
  });
}
function filterElement(elemId) {
  guardedNavigate(() => {
    currentFilter = { type: 'element', id: elemId }; expandedCardId = null; modifyModeCards = {};
    showCardsView();
    buildSidebar();
  });
}

function getSrgNum(d) {
  const m = String(d.srg_id).match(/srg_(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}
function getFilteredData() {
  let data = [...DB.srgData];
  if (!currentFilter) {
    // All Notes: note id 내림차순
    data.sort((a, b) => getSrgNum(b) - getSrgNum(a));
    return data;
  }
  if (currentFilter.type === 'category') data = data.filter(d => d.category_id === currentFilter.id);
  else if (currentFilter.type === 'element') data = data.filter(d => d.element_id === currentFilter.id);
  // Category/Element: note id 오름차순
  data.sort((a, b) => getSrgNum(a) - getSrgNum(b));
  return data;
}

// ===== Breadcrumb =====
function makeBreadcrumb(d) {
  const parts = [];
  if (d.category_id) {
    const catCode = String(d.category_id).replace('category_', '');
    parts.push(`${catCode}_${getCategoryName(d.category_id)}`);
  }
  if (d.element_id) {
    const elemCode = String(d.element_id).replace('element_', '');
    parts.push(`${elemCode}_${getElementName(d.element_id)}`);
  }
  if (d['cat-01']) parts.push(d['cat-01']);
  if (d['cat-02']) parts.push(d['cat-02']);
  if (d['cat-03']) parts.push(d['cat-03']);
  if (d['cat-04']) parts.push(d['cat-04']);
  return parts.map(p => `<span>${escHtml(p)}</span>`).join(' &gt;&gt; ');
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function formatNoteId(srgId) {
  const m = String(srgId).match(/srg_(\d+)/);
  if (m) return 'Note ID: ' + m[1];
  return srgId;
}

function getCatDropValues(catKey, catId, elemId) {
  return [...new Set(
    DB.srgData
      .filter(d => { if (elemId) return d.element_id === elemId; if (catId) return d.category_id === catId; return false; })
      .map(d => d[catKey])
      .filter(v => v && v.trim() !== '')
  )].sort();
}

// ===== Render Cards =====
function renderCards() {
  snapshotEditingCards();
  const list = document.getElementById('cardList');
  const filtered = getFilteredData();

  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:#a0aec0;padding:40px;text-align:center;font-size:15px">카드가 없습니다.</p>';
    return;
  }

  let html = '';
  filtered.forEach(d => {
    const id = d.srg_id;
    const isExpanded = expandedCardId === id;
    const isNew = String(id).startsWith('NEW_');
    const isModifyMode = isNew || modifyModeCards[id];

    html += `<div class="card${isExpanded ? ' expanded' : ''}" id="card-${escHtml(id)}">`;

    // Header
    html += `<div class="card-header">`;
    html += `<div class="card-left">`;
    html += `<span class="card-id">${escHtml(formatNoteId(isNew ? d._displayId || id : id))}</span>`;
    const bc = makeBreadcrumb(d);
    if (bc) html += `<span class="card-breadcrumb">${bc}</span>`;
    html += `</div>`;

    html += `<div class="card-date-wrap" style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:4px">`;
    if (isNew) {
      html += `<button class="btn-cancel-new" onclick="cancelNewCard('${escHtml(id)}')">Cancel</button>`;
    } else if (isModifyMode) {
      html += `<button class="btn-cancel-new" onclick="cancelModify('${escHtml(id)}')">Cancel</button>`;
    } else {
      html += `<button class="btn-open" onclick="toggleCard('${escHtml(id)}')">${isExpanded ? 'Close' : 'Open'}</button>`;
    }
    html += `</div>`;
    html += `</div>`;
    // APA + Date row: tops aligned via flex align-items:flex-start
    if (d.apa || d.date) {
      html += `<div class="card-apa-row" style="display:flex;align-items:flex-start;padding:0 20px 8px 20px">`;
      html += `<div class="card-apa" style="flex:1;margin-top:0">${escHtml(d.apa || '')}</div>`;
      if (d.date) {
        html += `<span class="card-date-info" style="font-size:14px;color:#999;white-space:nowrap;line-height:1.6;flex-shrink:0;margin-left:14px">${escHtml(d.date)}</span>`;
      }
      html += `</div>`;
    }

    // Detail
    html += `<div class="card-detail">`;
    html += `<div class="detail-body">`;

    const ro = !isModifyMode ? ' readonly' : '';
    html += `<div class="detail-center">`;
    html += `<div class="field-group"><textarea class="apa-short" data-field="apa" placeholder="APA"${ro}>${escHtml(d.apa)}</textarea></div>`;
    html += `<div class="field-group"><textarea class="medium" data-field="context" placeholder="Context"${ro}>${escHtml(d.context)}</textarea></div>`;
    html += `<div class="field-group"><textarea class="tall" data-field="text" placeholder="Text"${ro}>${escHtml(d.text)}</textarea></div>`;
    html += `<div class="field-group comment-group"><textarea class="comment-tall" data-field="comment" placeholder="Comment"${ro}>${escHtml(d.comment)}</textarea></div>`;
    html += `</div>`;

    // Right panel
    const locked = !isModifyMode;
    html += `<div class="detail-right">`;
    html += buildCatTree(d, locked);
    html += `<div style="margin-top:12px"></div>`;
    html += buildCatDropdowns(d, locked);

    const btnLabel = isNew ? 'Save' : (isModifyMode ? 'Save' : 'Modify');
    const btnAction = isNew
      ? `confirmSave('${escHtml(id)}')`
      : (isModifyMode ? `confirmSave('${escHtml(id)}')` : `modifyCard('${escHtml(id)}')`);
    html += `<div class="detail-right-actions">`;
    html += `<button class="btn-del" onclick="confirmDelete('${escHtml(id)}')"${isNew ? ' disabled style="opacity:.4;cursor:not-allowed;pointer-events:none"' : ''}>Delete</button>`;
    html += `<button class="btn-save" id="btnSave-${escHtml(id)}" onclick="${btnAction}">${btnLabel}</button>`;
    html += `<button onclick="confirmPrint('${escHtml(id)}')">Print</button>`;
    html += `</div>`;

    html += `</div>`; // detail-right
    html += `</div>`; // detail-body
    html += `</div>`; // card-detail
    html += `</div>`; // card
  });

  list.innerHTML = html;
  if (expandedCardId) {
    const el = document.getElementById('card-' + expandedCardId);
    if (el) {
      setTimeout(() => {
        setupAutoResize(el);
      }, 50);
    }
  }
}

// ===== Category tree inside detail (+ button adds element) =====
function buildCatTree(d, locked) {
  let html = `<div class="cat-tree${locked ? ' locked' : ''}">`;
  DB.categories.forEach(cat => {
    if (cat.category_id === 'category_99') return;
    const catCode = cat.category_id.replace('category_', '');
    const isSelected = d.category_id === cat.category_id;
    html += `<div class="ct-cat${isSelected ? ' ct-cat-selected' : ''}" style="${isSelected ? 'color:#4a7dff' : ''}">`;
    html += `<span onclick="setCatElem('${d.srg_id}','${cat.category_id}','')">${catCode}_${escHtml(cat.category_name)}</span>`;
    if (!locked) {
      html += `<span class="plus-btn" onclick="event.stopPropagation();openAddElementForCategory('${d.srg_id}','${cat.category_id}')" title="새 Element 추가">+</span>`;
    }
    html += `</div>`;

    const elems = getElementsForCategory(cat.category_id);
    elems.forEach(elem => {
      const elemCode = elem.element_id.replace('element_', '');
      const eSelected = d.element_id === elem.element_id;
      html += `<div class="ct-elem${eSelected ? ' selected' : ''}"`;
      if (!locked) html += ` onclick="setCatElem('${d.srg_id}','${cat.category_id}','${elem.element_id}')"`;
      html += `>${elemCode}_${escHtml(elem.element_name)}</div>`;
    });
  });
  html += '</div>';
  return html;
}

function buildCatDropdowns(d, locked) {
  let html = '';
  for (let i = 1; i <= 4; i++) {
    const key = 'cat-0' + i;
    const val = d[key] || '';
    const options = getCatDropValues(key, d.category_id, d.element_id);
    html += `<div class="cat-drop-row">`;
    html += `<select data-catdrop="${key}"${locked ? ' disabled' : ''} onchange="toggleCatBtn(this,'${d.srg_id}','${key}')">`;
    html += `<option value="">Cat-0${i}</option>`;
    options.forEach(opt => { html += `<option value="${escHtml(opt)}"${val === opt ? ' selected' : ''}>${escHtml(opt)}</option>`; });
    if (val && !options.includes(val)) html += `<option value="${escHtml(val)}" selected>${escHtml(val)}</option>`;
    html += `</select>`;
    if (!locked && val) {
      html += `<span class="plus-btn" title="항목 수정" onclick="openModifyCatItemModal('${d.srg_id}','${key}')" style="font-size:11px;font-weight:700">M</span>`;
    } else {
      html += `<span class="plus-btn${locked ? ' locked' : ''}" title="새 항목 추가" onclick="openAddCatItemModal('${d.srg_id}','${key}')">+</span>`;
    }
    html += `</div>`;
  }
  return html;
}

function toggleCatBtn(sel, srgId, catKey) {
  const row = sel.closest('.cat-drop-row');
  const btn = row ? row.querySelector('.plus-btn') : null;
  if (!btn || btn.classList.contains('locked')) return;
  if (sel.value) {
    btn.textContent = 'M';
    btn.title = '항목 수정';
    btn.style.fontSize = '11px';
    btn.style.fontWeight = '700';
    btn.setAttribute('onclick', "openModifyCatItemModal('" + srgId + "','" + catKey + "')");
  } else {
    btn.textContent = '+';
    btn.title = '새 항목 추가';
    btn.style.fontSize = '';
    btn.style.fontWeight = '';
    btn.setAttribute('onclick', "openAddCatItemModal('" + srgId + "','" + catKey + "')");
  }
}

function openModifyCatItemModal(srgId, catKey) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  const cardEl = document.getElementById('card-' + srgId);
  const sel = cardEl ? cardEl.querySelector('[data-catdrop="' + catKey + '"]') : null;
  const currentVal = sel ? sel.value : (d[catKey] || '');
  if (!currentVal) { toast('선택된 값이 없습니다.'); return; }
  const displayKey = catKey.replace('cat-0','Cat-0');
  const html = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>${displayKey} 항목 수정</h3>
        <label>현재 명칭</label>
        <input type="text" id="modalCatItemOld" value="${escHtml(currentVal)}" readonly style="background:#f1f3f5;color:#6c757d">
        <label>새 명칭</label>
        <input type="text" id="modalCatItemNew" value="${escHtml(currentVal)}">
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">취소</button>
          <button class="btn-confirm" onclick="doModifyCatItem('${srgId}','${catKey}')">수정</button>
        </div>
      </div>
    </div>`;
  showModal(html);
  setTimeout(() => { const inp = document.getElementById('modalCatItemNew'); inp.focus(); inp.select(); }, 100);
}

async function doModifyCatItem(srgId, catKey) {
  const oldVal = document.getElementById('modalCatItemOld').value.trim();
  const newVal = document.getElementById('modalCatItemNew').value.trim();
  if (!newVal) { toast('새 값을 입력하세요.'); return; }
  if (oldVal === newVal) { closeModal(); return; }
  const d = DB.srgData.find(x => x.srg_id === srgId);
  closeModal();
  showLoading('항목 수정 데이터 준비 중...');
  try {
    updateLoadingMsg('서버에 수정 요청 전송 중...');
    await new Promise(r => setTimeout(r, 150));
    const res = await gasPost({
      action: 'renameCatItem',
      catKey, oldValue: oldVal, newValue: newVal,
      category_id: d ? d.category_id : '',
      element_id: d ? d.element_id : ''
    });
    if (res.ok) {
      updateLoadingMsg('서버에서 최신 데이터 불러오는 중...');
      await new Promise(r => setTimeout(r, 150));
      const freshRes = await gasGet({ action: 'getAll' });
      if (freshRes.ok) {
        updateLoadingMsg('로컬 데이터 업데이트 중...');
        await new Promise(r => setTimeout(r, 150));
        DB = freshRes;
        if (!DB.links) DB.links = [];
        DB.links = DB.links.map(l => {
          if (l['no.'] !== undefined && l.no === undefined) { l.no = l['no.']; }
          return l;
        });
        updateLoadingMsg('화면 갱신 중...');
        await new Promise(r => setTimeout(r, 150));
        skipSnapshot = true;
        buildSidebar();
        renderCards();
      }
      toast('항목 수정 완료!');
    } else { toast('수정 실패: ' + (res.error || ''), 3000); }
  } catch(e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function setCatElem(srgId, catId, elemId) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  d.category_id = catId;
  d.element_id = elemId;
  renderCards();
}

function toggleCard(id) {
  const prevId = expandedCardId;

  if (prevId === id) {
    // Close current card
    expandedCardId = null;
    delete modifyModeCards[id];
    const card = document.getElementById('card-' + id);
    if (card) {
      card.classList.remove('expanded');
      const btn = card.querySelector('.btn-open');
      if (btn) btn.textContent = 'Open';
    }
  } else {
    // Close previously expanded card (if any)
    if (prevId) {
      const prevCard = document.getElementById('card-' + prevId);
      if (prevCard) {
        prevCard.classList.remove('expanded');
        const btn = prevCard.querySelector('.btn-open');
        if (btn) btn.textContent = 'Open';
      }
      delete modifyModeCards[prevId];
    }
    // Open new card
    expandedCardId = id;
    const card = document.getElementById('card-' + id);
    if (card) {
      card.classList.add('expanded');
      const btn = card.querySelector('.btn-open');
      if (btn) btn.textContent = 'Close';
    }
  }
}
function cancelNewCard(id) {
  showConfirmModal('작성 취소', '카드 작성을 취소하시겠습니까?', '확인', () => {
    DB.srgData = DB.srgData.filter(d => d.srg_id !== id);
    expandedCardId = null;
    document.getElementById('btnNewCardWrap').style.display = '';
    renderCards();
  });
}

function gatherCardData(srgId) {
  const cardEl = document.getElementById('card-' + srgId);
  if (!cardEl) return null;
  const get = (sel) => { const el = cardEl.querySelector(sel); return el ? el.value : ''; };
  const d = DB.srgData.find(x => x.srg_id === srgId);
  // Generate current date in yyyy.mm.dd hh:mm:ss format
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  return {
    srg_id: srgId, apa: get('[data-field="apa"]'), context: get('[data-field="context"]'),
    text: get('[data-field="text"]'), comment: get('[data-field="comment"]'),
    category_id: d ? d.category_id : '', element_id: d ? d.element_id : '',
    'cat-01': get('[data-catdrop="cat-01"]'), 'cat-02': get('[data-catdrop="cat-02"]'),
    'cat-03': get('[data-catdrop="cat-03"]'), 'cat-04': get('[data-catdrop="cat-04"]'),
    date: dateStr
  };
}

// Save unsaved form input into DB before re-rendering
let skipSnapshot = false;
function snapshotEditingCards() {
  if (skipSnapshot) { skipSnapshot = false; return; }
  const editingIds = Object.keys(modifyModeCards);
  // Also include NEW_ cards
  DB.srgData.forEach(d => {
    if (String(d.srg_id).startsWith('NEW_') && !editingIds.includes(d.srg_id)) {
      editingIds.push(d.srg_id);
    }
  });
  editingIds.forEach(srgId => {
    const cardEl = document.getElementById('card-' + srgId);
    if (!cardEl) return;
    const d = DB.srgData.find(x => x.srg_id === srgId);
    if (!d) return;
    const get = (sel) => { const el = cardEl.querySelector(sel); return el ? el.value : ''; };
    d.apa = get('[data-field="apa"]');
    d.context = get('[data-field="context"]');
    d.text = get('[data-field="text"]');
    d.comment = get('[data-field="comment"]');
    const cat01 = get('[data-catdrop="cat-01"]'); if (cat01) d['cat-01'] = cat01;
    const cat02 = get('[data-catdrop="cat-02"]'); if (cat02) d['cat-02'] = cat02;
    const cat03 = get('[data-catdrop="cat-03"]'); if (cat03) d['cat-03'] = cat03;
    const cat04 = get('[data-catdrop="cat-04"]'); if (cat04) d['cat-04'] = cat04;
  });
}

function validateCard(srgId) {
  const row = gatherCardData(srgId);
  if (!row) return null;
  const missing = [];
  if (!row.apa.trim()) missing.push('APA');
  if (!row.context.trim()) missing.push('Context');
  if (!row.text.trim()) missing.push('Text');
  if (!row.comment.trim()) missing.push('Comment');
  if (missing.length > 0) { showAlertModal('입력 필요', missing.join(', ') + ' 항목을 입력해 주세요.'); return null; }
  return row;
}

function confirmSave(srgId) {
  const row = validateCard(srgId);
  if (!row) return;
  showConfirmModal('저장 확인', '이 카드를 저장하시겠습니까?', '저장', () => doSaveCard(srgId));
}
async function doSaveCard(srgId) {
  const row = gatherCardData(srgId);
  if (!row) return;
  const isNew = srgId.startsWith('NEW_');
  showLoading('카드 데이터 수집 중...');
  await new Promise(r => setTimeout(r, 200));
  try {
    const action = isNew ? 'create' : 'update';
    if (isNew) {
      const d = DB.srgData.find(x => x.srg_id === srgId);
      row.srg_id = d && d._displayId ? d._displayId : generateNextSrgId();
    }
    updateLoadingMsg('서버에 데이터 전송 중...');
    await new Promise(r => setTimeout(r, 150));
    // create는 retry 시 중복 행 생성 방지를 위해 retry=0
    const payload = { action, row };
    const res = isNew
      ? await gasFetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) }, 0)
      : await gasPost(payload);
    if (res.ok) {
      updateLoadingMsg('로컬 데이터 업데이트 중...');
      await new Promise(r => setTimeout(r, 150));
      const finalId = res.srg_id || row.srg_id;
      if (isNew) {
        const idx = DB.srgData.findIndex(x => x.srg_id === srgId);
        if (idx >= 0) {
          DB.srgData[idx] = { ...row, srg_id: finalId, date: row.date };
          delete DB.srgData[idx]._displayId;
        }
      } else {
        const idx = DB.srgData.findIndex(x => x.srg_id === srgId);
        if (idx >= 0) DB.srgData[idx] = { ...row, date: row.date };
      }
      updateLoadingMsg('화면 갱신 중...');
      await new Promise(r => setTimeout(r, 150));
      expandedCardId = finalId;
      delete modifyModeCards[srgId];
      document.getElementById('btnNewCardWrap').style.display = '';
      buildSidebar(); renderCards();
      toast('저장 완료!');
    } else { toast('저장 실패: ' + (res.error || ''), 3000); }
  } catch (e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function confirmDelete(srgId) {
  showConfirmModal('삭제 확인', '이 카드를 삭제하시겠습니까?\n' + formatNoteId(srgId), '삭제', () => doDeleteCard(srgId), 'btn-danger');
}
async function doDeleteCard(srgId) {
  if (srgId.startsWith('NEW_')) {
    DB.srgData = DB.srgData.filter(d => d.srg_id !== srgId);
    expandedCardId = null; renderCards(); return;
  }
  showLoading('삭제 중...');
  try {
    const res = await gasPost({ action: 'delete', srg_id: srgId });
    if (res.ok) {
      DB.srgData = DB.srgData.filter(d => d.srg_id !== srgId);
      expandedCardId = null;
      buildSidebar(); renderCards();
      toast('삭제 완료!');
    } else { toast('삭제 실패: ' + (res.error || ''), 3000); }
  } catch (e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function modifyCard(srgId) {
  showConfirmModal('수정 확인', '이 카드를 수정하시겠습니까?', '수정', () => {
    modifyModeCards[srgId] = true;
    renderCards();
  });
}
function cancelModify(srgId) {
  showConfirmModal('수정 취소', '카드 수정을 취소하시겠습니까?', '확인', () => {
    delete modifyModeCards[srgId];
    renderCards();
  });
}

function confirmPrint(srgId) {
  expandedCardId = srgId; renderCards();
  setTimeout(() => {
    const card = document.getElementById('card-' + srgId);
    if (!card) return;
    // Helper: scroll so card top edge sits just below the sticky button wrapper
    function scrollToCardTop() {
      const mainEl = document.getElementById('main');
      const wrap = document.getElementById('btnNewCardWrap');
      if (!mainEl) return;
      const wrapH = wrap ? wrap.offsetHeight : 0;
      const cardTop = card.offsetTop;
      mainEl.scrollTop = cardTop - wrapH;
    }
    scrollToCardTop();
    // Replace textareas with div mirrors for print (textareas clip content)
    const textareas = card.querySelectorAll('.detail-center textarea:not(.apa-short)');
    const mirrors = [];
    textareas.forEach(ta => {
      const div = document.createElement('div');
      div.className = 'print-mirror';
      div.textContent = ta.value;
      div.dataset.field = ta.dataset.field;
      div.style.cssText = 'display:none';
      ta.parentNode.insertBefore(div, ta.nextSibling);
      mirrors.push({ ta, div });
    });
    // Hide the APA field-group in detail center (already shown in card header)
    const apaTa = card.querySelector('.detail-center textarea.apa-short');
    const apaGroup = apaTa ? apaTa.closest('.field-group') : null;
    if (apaGroup) apaGroup.classList.add('print-hide-apa');
    card.classList.add('print-ready');
    setTimeout(() => {
      window.print();
      mirrors.forEach(m => m.div.remove());
      card.classList.remove('print-ready');
      if (apaGroup) apaGroup.classList.remove('print-hide-apa');
      // Restore scroll to card top after print dialog closes
      scrollToCardTop();
      requestAnimationFrame(scrollToCardTop);
    }, 200);
  }, 300);
}

let newCardCounter = 0;
let isInitialLoad = true;
function openNewCard() {
  newCardCounter++;
  const tempId = 'NEW_' + newCardCounter;
  const displayId = generateNextSrgId();
  DB.srgData.unshift({
    srg_id: tempId, _displayId: displayId,
    apa: '', context: '', text: '', comment: '',
    category_id: currentFilter?.type === 'category' ? currentFilter.id : '',
    element_id:  currentFilter?.type === 'element' ? currentFilter.id : '',
    'cat-01': '', 'cat-02': '', 'cat-03': '', 'cat-04': ''
  });
  expandedCardId = tempId;
  document.getElementById('btnNewCardWrap').style.display = 'none';
  renderCards();
}

// ===== Auto-resize textareas =====
function autoResizeTextarea(ta) {
  const minH = parseInt(window.getComputedStyle(ta).minHeight) || 0;
  // Temporarily remove min-height to get true scrollHeight
  ta.style.minHeight = '0';
  ta.style.height = 'auto';
  const scrollH = ta.scrollHeight;
  ta.style.minHeight = '';
  // Add 2px buffer to prevent subpixel rounding scroll
  ta.style.height = Math.max(minH, scrollH + 2) + 'px';
}

function setupAutoResize(cardEl) {
  if (!cardEl) return;
  const textareas = cardEl.querySelectorAll('.detail-center textarea');
  textareas.forEach(ta => {
    autoResizeTextarea(ta);
    ta.removeEventListener('input', ta._autoResizeHandler);
    ta._autoResizeHandler = () => { autoResizeTextarea(ta); syncRightPanel(cardEl); };
    ta.addEventListener('input', ta._autoResizeHandler);
  });
  syncRightPanel(cardEl);
  // Scroll cat-tree to show selected category at top
  scrollCatTreeToSelected(cardEl);
}

// ===== Resize handler: auto-adjust textarea heights on browser resize =====
window.addEventListener('resize', (function() {
  let timer;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      if (!expandedCardId) return;
      const card = document.getElementById('card-' + expandedCardId);
      if (!card) return;
      const textareas = card.querySelectorAll('.detail-center textarea');
      textareas.forEach(ta => autoResizeTextarea(ta));
      syncRightPanel(card);
    }, 100);
  };
})());

function scrollCatTreeToSelected(cardEl) {
  if (!cardEl) return;
  const catTree = cardEl.querySelector('.cat-tree');
  if (!catTree) return;
  const selectedCat = catTree.querySelector('.ct-cat-selected');
  if (selectedCat) {
    selectedCat.scrollIntoView({ block: 'center', behavior: 'instant' });
  }
}

function syncRightPanel(cardEl) {
  if (!cardEl) return;
  const center = cardEl.querySelector('.detail-center');
  const right = cardEl.querySelector('.detail-right');
  if (!center || !right) return;
  // Get the bottom of the comment textarea
  const commentTa = center.querySelector('[data-field="comment"]');
  if (!commentTa) return;
  const centerBottom = commentTa.getBoundingClientRect().bottom;
  // Get the actions bar
  const actions = right.querySelector('.detail-right-actions');
  if (!actions) return;
  // Calculate how much extra space is needed
  const actionsBottom = actions.getBoundingClientRect().bottom;
  const diff = centerBottom - actionsBottom;
  // Find the spacer area between cat-04 and actions border-top
  // We adjust margin-top on actions to push it down
  const currentMarginTop = parseInt(window.getComputedStyle(actions).marginTop) || 16;
  if (diff > 0) {
    actions.style.marginTop = (currentMarginTop + diff) + 'px';
  }
}

// ===== Auto-load =====
loadAll();

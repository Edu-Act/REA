function showDeleteLastAccessModal() {
  if (!pdfCurrentRow || !pdfCurrentRow.last_access) return;
  document.getElementById('pdfDeleteLastAccessValue').textContent = pdfCurrentRow.last_access;
  const overlay = document.getElementById('pdfDeleteLastAccessModal');
  overlay.classList.add('show');
  // PDF 패널 가로 중앙에 위치
  const pdfPanel = document.querySelector('.pdf-panel');
  const modal = overlay.querySelector('.pdf-add-modal');
  if (pdfPanel && modal) {
    const r = pdfPanel.getBoundingClientRect();
    modal.style.position = 'fixed';
    modal.style.left = (r.left + r.width / 2) + 'px';
    modal.style.top = '50%';
    modal.style.transform = 'translate(-50%, -50%)';
  }
}
function closeDeleteLastAccessModal() {
  document.getElementById('pdfDeleteLastAccessModal').classList.remove('show');
}
async function confirmDeleteLastAccess() {
  closeDeleteLastAccessModal();
  if (!pdfCurrentRow) return;
  try {
    pdfCurrentRow.last_access = '';
    const chipEl2 = document.getElementById('pdfLastAccess');
    chipEl2.querySelector('.chip-text').textContent = '';
    chipEl2.classList.remove('visible');
    await savePdfField(pdfCurrentRow.no, 'last_access', '');
    toast('last_access 삭제 완료');
  } catch(e) { toast('삭제 오류: ' + e.message); }
}

// sync pdf footer: white area below Logout button's bottom edge
function syncPdfFooterHeight() {
  const logoutBtn = document.querySelector('.sidebar-bottom .btn-logout');
  const footer = document.getElementById('pdfPanelFooter');
  if (logoutBtn && footer) {
    const btnRect = logoutBtn.getBoundingClientRect();
    const gap = window.innerHeight - btnRect.bottom;
    footer.style.height = Math.max(0, gap) + 'px';
  }
}
window.addEventListener('resize', syncPdfFooterHeight);
setTimeout(syncPdfFooterHeight, 100);

// 드래그로 세로 위치 변경 (panel-divider-buttons, sidebar-toggle)
function makeDraggableY(el, parentEl) {
  let startY, startTop, dragging = false, moved = false;
  el.addEventListener('mousedown', function(e) {
    moved = false;
    startY = e.clientY;
    const rect = el.getBoundingClientRect();
    const parentRect = parentEl.getBoundingClientRect();
    startTop = rect.top - parentRect.top + el.offsetHeight / 2;
    function onMove(ev) {
      if (Math.abs(ev.clientY - startY) > 3) {
        if (!dragging) { dragging = true; el.classList.add('dragging'); }
        moved = true;
      }
      if (!dragging) return;
      const dy = ev.clientY - startY;
      const newTop = startTop + dy;
      const pct = (newTop / parentRect.height) * 100;
      el.style.top = Math.max(5, Math.min(95, pct)) + '%';
    }
    function onUp() {
      dragging = false;
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  // 드래그 중이면 버튼 클릭 차단
  el.addEventListener('click', function(e) {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
}
const dividerBtns = document.querySelector('.panel-divider-buttons');
const dividerEl = document.getElementById('panelDivider');
if (dividerBtns && dividerEl) makeDraggableY(dividerBtns, dividerEl);

const sidebarToggleBtn = document.getElementById('sidebarToggle');
const appLayout = document.getElementById('appLayout');
if (sidebarToggleBtn && appLayout) {
  sidebarToggleBtn.style.cursor = 'grab';
  let stStartY, stStartTop, stDragging = false, stMoved = false;
  sidebarToggleBtn.addEventListener('mousedown', function(e) {
    stDragging = true; stMoved = false;
    stStartY = e.clientY;
    const rect = sidebarToggleBtn.getBoundingClientRect();
    const parentRect = appLayout.getBoundingClientRect();
    stStartTop = rect.top - parentRect.top + rect.height / 2;
    sidebarToggleBtn.style.cursor = 'grabbing';
    function onMove(ev) {
      if (!stDragging) return;
      if (Math.abs(ev.clientY - stStartY) > 3) stMoved = true;
      const dy = ev.clientY - stStartY;
      const newTop = stStartTop + dy;
      const pct = (newTop / parentRect.height) * 100;
      sidebarToggleBtn.style.top = Math.max(5, Math.min(95, pct)) + '%';
    }
    function onUp() {
      stDragging = false;
      sidebarToggleBtn.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (stMoved) { e.preventDefault(); e.stopPropagation(); }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  sidebarToggleBtn.addEventListener('click', function(e) {
    if (stMoved) { e.preventDefault(); e.stopPropagation(); stMoved = false; return; }
    toggleSidebar();
  }, true);
}

function togglePdfHeader() {
  const header = document.querySelector('.pdf-panel-header');
  const restore = document.getElementById('pdfHeaderRestore');
  const toggleBtn = document.getElementById('pdfHeaderToggle');
  if (!header) return;
  const isCollapsed = header.classList.contains('collapsed');
  if (isCollapsed) {
    header.classList.remove('collapsed');
    restore.classList.remove('show');
  } else {
    // ^ 버튼의 가로 위치를 기준으로 V 버튼 위치 설정
    if (toggleBtn && restore) {
      const btnRect = toggleBtn.getBoundingClientRect();
      const pdfPanel = document.querySelector('.pdf-panel');
      const panelRect = pdfPanel ? pdfPanel.getBoundingClientRect() : { left: 0 };
      restore.style.left = 'auto';
      restore.style.right = (panelRect.right - btnRect.right) + 'px';
      const restoreBtn = restore.querySelector('button');
      if (restoreBtn) restoreBtn.style.width = btnRect.width + 'px';
    }
    header.classList.add('collapsed');
    restore.classList.add('show');
  }
}

// nav 너비를 chip+Add+Load 버튼 영역에 맞춤
function alignNavToButtons() {
  const addBtn = document.querySelector('.pdf-header-btn.btn-add');
  const loadBtn = document.getElementById('pdfLoadBtn');
  const searchBtn = document.querySelector('.pdf-header-btn.btn-search');
  const nav = document.querySelector('.pdf-nav');
  const prevBtn = document.getElementById('pdfNavPrev');
  const nextBtn = document.getElementById('pdfNavNext');
  const toggleBtn = document.getElementById('pdfHeaderToggle');
  const noInput = document.getElementById('pdfNavNo');
  if (addBtn && loadBtn && nav && prevBtn && nextBtn) {
    // nav: < 왼쪽=Add 왼쪽, > 오른쪽=Search 오른쪽
    const left = addBtn.getBoundingClientRect().left;
    const right = searchBtn ? searchBtn.getBoundingClientRect().right : loadBtn.getBoundingClientRect().right;
    const navW = right - left;
    nav.style.width = navW + 'px';
    const inputW = noInput ? noInput.offsetWidth : 48;
    const remaining = navW - inputW;
    const btnW = Math.max(remaining / 2, 30);
    prevBtn.style.width = btnW + 'px';
    prevBtn.style.flex = 'none';
    nextBtn.style.width = btnW + 'px';
    nextBtn.style.flex = 'none';
    // ^ 버튼: Load와 동일 크기, 왼쪽 경계=Load 왼쪽 경계와 일치
    if (toggleBtn && loadBtn) {
      const loadW = loadBtn.offsetWidth;
      toggleBtn.style.width = loadW + 'px';
      toggleBtn.style.marginLeft = '0px';
      // 현재 위치 측정 후 Load 왼쪽과 맞춤
      requestAnimationFrame(() => {
        const toggleLeft = toggleBtn.getBoundingClientRect().left;
        const loadLeft = loadBtn.getBoundingClientRect().left;
        const diff = loadLeft - toggleLeft;
        toggleBtn.style.marginLeft = diff + 'px';
      });
    }
  }
}
window.addEventListener('resize', alignNavToButtons);
setTimeout(alignNavToButtons, 200);

loadAll();

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>REA Lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:#fff;color:#333;font-size:14px}

.layout{display:flex;height:100vh;overflow:hidden}

.sidebar{width:257px;min-width:257px;background:#fafbfc;border-right:1px solid #e2e6ea;overflow-y:auto;padding:8px 0;font-size:16px;user-select:none;display:flex;flex-direction:column}
.sidebar-top{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none}
.sidebar-top::-webkit-scrollbar{display:none}
.sidebar-bottom{padding:10px 12px;border-top:1px solid #e2e6ea}
.sidebar-bottom .btn-logout{width:100%;padding:9px 16px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:13.5px;color:#555;font-weight:600;transition:all .15s}
.sidebar-bottom .btn-logout:hover{background:#f0f0f0;border-color:#aaa}

.tree-node{position:relative;cursor:pointer}
.tree-row{display:flex;align-items:center;padding:4px 10px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;margin:1px 6px;transition:background .12s}
.tree-row:hover{background:#e4ecf7}
.tree-row.active{background:#d0e0f5;font-weight:600}
.tree-toggle{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:#555;margin-right:1px}
.tree-toggle.has-children{cursor:pointer}
.tree-toggle.has-children::before{content:'▶';display:block;transition:transform .15s}
.tree-node.open>.tree-row .tree-toggle.has-children::before{transform:rotate(90deg)}
.tree-icon{width:18px;height:18px;flex-shrink:0;margin-right:5px;display:inline-flex;align-items:center;justify-content:center;font-size:14.5px}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#333}
.tree-children{display:none;padding-left:12px;position:relative}
.tree-children::before{content:'';position:absolute;left:17px;top:0;bottom:8px;width:1px;background:#d8dce0}
.tree-node.open>.tree-children{display:block}
.tree-child-row{position:relative;padding-left:10px}
.tree-child-row::before{content:'';position:absolute;left:5px;top:12px;width:10px;height:1px;background:#d8dce0}
.tree-spacer{height:28px}
.tree-divider{height:16px}
.tree-menu-item{display:flex;align-items:center;padding:4px 8px 4px 30px;margin:2px 4px;border-radius:5px;cursor:pointer;color:#4a7dff;font-size:14px;font-weight:600;transition:background .12s}
.tree-menu-item:hover{background:#e4ecf7}

.layout{position:relative}
.sidebar{transition:width .3s ease,min-width .3s ease,opacity .3s ease}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;opacity:0;padding:0;border-right:none}
.sidebar-toggle{position:absolute;top:30%;transform:translateY(-50%);left:237px;width:20px;height:60px;background:#e8ecf0;border:1px solid #d2d8e0;border-radius:6px 0 0 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100;transition:left .3s ease,border-radius .3s ease,background .15s;font-size:11px;color:#666;padding:0}
.sidebar-toggle:hover{background:#d0d8e0;color:#333}
.sidebar-toggle.collapsed{left:0;border-radius:0 6px 6px 0}

.pdf-wrap{position:relative;display:flex;flex-shrink:0;width:0;height:100%;transition:width .3s ease,flex .3s ease;overflow:hidden}
.pdf-wrap.open{width:55vw;min-width:200px}
.pdf-wrap.expanded{flex:1;width:auto;min-width:0}
.pdf-panel{width:100%;height:100%;background:#f4f5f7;display:flex;flex-direction:column}
.pdf-panel-header{display:flex;flex-direction:column;border-bottom:1px solid #e2e6ea;background:#fff;flex-shrink:0}
.pdf-header-row{display:flex;align-items:center;gap:8px;padding:5px 12px}
.pdf-header-row:first-child{padding-top:20px}
.pdf-header-row+.pdf-header-row{padding-top:0}
.pdf-header-input{flex:1;min-width:0;padding:4px 8px;border:1px solid transparent;font-size:13px;color:#333;outline:none;background:transparent;line-height:1.5;font-family:inherit;border-radius:4px;box-sizing:border-box}
.pdf-header-input::placeholder{color:#aaa}
.pdf-header-input:read-only{cursor:default}
.pdf-header-input.editing{background:#fff;border-color:#d2d8e0}
.pdf-header-btn{padding:5px 14px;border:none;border-radius:5px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;color:#fff;height:30px;box-sizing:border-box}
.pdf-header-btn.btn-load{background:#f0ad4e;color:#fff}
.pdf-header-btn.btn-load:hover{background:#ec971f}
.pdf-header-btn.btn-modify{background:#e8ecf0;color:#555}
.pdf-header-btn.btn-modify:hover{background:#d0d8e0;color:#333}
.pdf-header-btn.btn-add{background:#5bc0de;color:#fff}
.pdf-header-btn.btn-add:hover{background:#46b8da}
.pdf-header-btn.btn-search{background:#8e7cc3;color:#fff}
.pdf-header-btn.btn-search:hover{background:#7b68ae}
.pdf-header-btn:disabled{opacity:.45;cursor:not-allowed}
.pdf-nav{display:flex;align-items:center;gap:0;margin-left:auto}
.pdf-nav-btn{padding:5px 10px;border:1px solid #4a7dff;background:#4a7dff;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;height:30px;box-sizing:border-box;flex:1}
.pdf-nav-btn:first-child{border-radius:5px 0 0 5px;border-right:1px solid rgba(255,255,255,.3)}
.pdf-nav-btn:last-child{border-radius:0 5px 5px 0;border-left:1px solid rgba(255,255,255,.3)}
.pdf-header-btn.btn-htoggle{background:#e8ecf0;color:#555;border:1px solid #d2d8e0}
.pdf-header-btn.btn-htoggle:hover{background:#d0d8e0;color:#333}
.pdf-nav-btn:hover{background:#3a65d4}
.pdf-nav-btn:disabled{opacity:.45;cursor:not-allowed}
.pdf-nav-no{padding:4px 0;width:48px;flex-shrink:0;border:1px solid #4a7dff;border-left:none;border-right:none;background:#fff;color:#4a7dff;font-size:12.5px;font-weight:700;text-align:center;outline:none;font-family:inherit;border-radius:0;height:30px;box-sizing:border-box}
.pdf-nav-no:focus{background:#eef2ff}
#pdfApaInput{font-weight:600;color:#222;font-size:13.5px}
.pdf-last-access-chip{flex-shrink:0;margin-left:6px;padding:3px 10px;background:#edf2f7;border:1px solid #d2d8e0;border-radius:12px;font-size:12px;color:#666;white-space:nowrap;cursor:default;transition:all .15s;height:24px;box-sizing:border-box;line-height:16px;display:none;align-items:center;gap:6px}
.pdf-last-access-chip.visible{display:inline-flex}
.pdf-last-access-chip .chip-x{cursor:pointer;color:#aaa;font-weight:700;font-size:13px;line-height:1}
.pdf-last-access-chip .chip-x:hover{color:#d9534f}
.pdf-add-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:10000;align-items:center;justify-content:center}
.pdf-add-modal-overlay.show{display:flex}
.pdf-add-modal{background:#fff;border-radius:12px;padding:24px;width:420px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.pdf-add-modal-title{font-size:16px;font-weight:700;color:#2d3748;margin-bottom:16px}
.pdf-add-modal-label{font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px}
.pdf-add-modal-input{width:100%;padding:8px 12px;border:1px solid #d2d8e0;border-radius:6px;font-size:13px;outline:none;box-sizing:border-box;margin-bottom:12px;font-family:inherit}
.pdf-add-modal-input:focus{border-color:#4a7dff;box-shadow:0 0 0 2px rgba(74,125,255,.15)}
.pdf-add-modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.pdf-add-modal-btn{padding:8px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.pdf-add-modal-btn.btn-cancel{background:#e2e6ea;color:#555}
.pdf-add-modal-btn.btn-cancel:hover{background:#d0d4d8}
.pdf-add-modal-btn.btn-confirm{background:#5cb85c;color:#fff}
.pdf-add-modal-btn.btn-confirm:hover{background:#449d44}
.pdf-loading-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(244,245,247,.85);z-index:5;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.pdf-loading-overlay.show{display:flex}
.pdf-loading-spinner{width:36px;height:36px;border:3px solid #e2e6ea;border-top-color:#4a7dff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pdf-loading-text{font-size:13px;color:#666;font-weight:500}
.pdf-panel-header{transition:max-height .3s ease,opacity .3s ease,padding .3s ease;max-height:200px;overflow:hidden;opacity:1}
.pdf-panel-header.collapsed{max-height:0;opacity:0;border-bottom:none;overflow:hidden}
.pdf-header-restore{position:absolute;top:0;right:12px;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s ease .1s}
.pdf-header-restore.show{opacity:1;pointer-events:auto}
.pdf-header-restore button{padding:5px 14px;border:1px solid #d2d8e0;border-top:none;background:#e8ecf0;cursor:pointer;font-size:12.5px;font-weight:700;color:#555;border-radius:0 0 5px 5px;transition:all .15s;height:30px;box-sizing:border-box}
.pdf-header-restore button:hover{background:#d0d8e0;color:#333}
.pdf-panel-body{flex:1;min-height:0;position:relative;overflow:visible}
.pdf-panel-footer{display:none}
.pdf-panel-body iframe{position:absolute;top:0;left:0;border:none;transform-origin:0 0}
.pdf-panel-body .pdf-placeholder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#a0aec0;font-size:14px;text-align:center;padding:20px;line-height:1.6}

.panel-divider{width:1px;flex-shrink:0;background:#d2d8e0;position:relative;z-index:10;pointer-events:none}
.panel-divider-buttons{position:absolute;top:30%;transform:translateY(-50%);left:0;display:flex;flex-direction:row;margin-left:-20px;transition:margin-left .3s ease;pointer-events:auto;cursor:grab}
.panel-divider-buttons.dragging{cursor:grabbing}
.panel-divider.state-mainFull .panel-divider-buttons{margin-left:0}
.panel-divider.state-pdfFull .panel-divider-buttons{margin-left:-20px}
.panel-divider button{width:20px;height:60px;background:#e8ecf0;border:1px solid #d2d8e0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666;padding:0;transition:background .15s,color .15s}
.panel-divider button:hover{background:#d0d8e0;color:#333}
.panel-divider button.active{background:#4a7dff;border-color:#3a6dee;color:#fff}
.panel-divider button.hidden{display:none}
#btnExpandMain{border-radius:6px 0 0 6px;border-right:none}
#btnExpandPdf{border-radius:0 6px 6px 0;border-left:none}

.main{flex:1;overflow-y:scroll;padding:20px 28px;background:#fff;scroll-behavior:smooth;transition:flex .3s ease,width .3s ease,min-width .3s ease,padding .3s ease,overflow .3s ease}
.main.collapsed{flex:0;width:0;min-width:0;padding:0;overflow:hidden}

.btn-new-card-wrap{position:sticky;top:-20px;z-index:10;background:#fff;padding-top:20px;padding-bottom:16px;margin:-20px -28px 0;padding-left:28px;padding-right:28px}
.btn-new-card{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;background:linear-gradient(135deg,#8e9aaf 0%,#6b7b8d 100%);color:#fff;border:none;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;box-shadow:0 2px 8px rgba(107,123,141,.3)}
.btn-new-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(107,123,141,.4)}
.btn-new-card:active{transform:translateY(0)}
.btn-new-card:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-new-card:disabled:hover{transform:none;box-shadow:none}

.card{background:#fff;border:2px solid #a0aab5;border-radius:10px;margin-bottom:12px;overflow:hidden;transition:all .25s ease;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;z-index:1}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.1);border-color:#8090a0}
.card.expanded{box-shadow:0 4px 20px rgba(0,0,0,.12);border-color:#6b7b8d;background:#fff}
.card-header{display:flex;align-items:flex-start;padding:19px 20px 16.5px;gap:14px;cursor:default}
.card-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:1;min-width:0}
.card-id{display:inline-block;padding:3px 10px;background:#eef2ff;border:1px solid #c3d4ff;border-radius:12px;font-size:12.5px;font-weight:600;color:#4a7dff;flex-shrink:0;white-space:nowrap}
.card-breadcrumb{font-size:14px;color:#b0bac5;line-height:1.5;min-width:0;word-break:break-word;display:block;width:100%}
.card-breadcrumb span{font-weight:700;color:#34495e}
.card-breadcrumb.bc-full{display:none}
.card-breadcrumb.bc-cats{margin-top:2px}
.card-bc-row{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.main.panel-full .card-bc-row{flex-direction:row;align-items:center;gap:6px}
.card-cat-chips{display:flex;flex-wrap:wrap;gap:4px}
.card-cat-chip{display:inline-block;padding:2px 9px;background:#f0f4f8;border:1px solid #d2d8e0;border-radius:10px;font-size:11.5px;color:#666;white-space:nowrap}
.card-id-print{display:none}
.main.panel-full .card-breadcrumb.bc-full{display:block}
.main.panel-full .card-breadcrumb.bc-normal{display:none}
.card-date-chip{display:inline-block;padding:3px 10px;background:#f0f4f8;border:1px solid #d2d8e0;border-radius:12px;font-size:12px;color:#888;white-space:nowrap;flex-shrink:0}
.card-elem-chip{display:inline-flex;align-items:center;padding:3px 10px;background:#eef2ff;border:1px solid #c3d4ff;border-radius:12px;font-size:12px;font-weight:600;color:#4a7dff;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:all .15s}
.card-elem-chip:hover{background:#dde6ff;border-color:#a0b8ff}
.card-elem-chip.disabled{cursor:default;opacity:.7}
.card-elem-chip.disabled:hover{background:#eef2ff;border-color:#c3d4ff}
.card-elem-chip.placeholder{background:#f0f4f8;border-color:#d2d8e0;color:#888;font-weight:500}
.card-elem-chip.placeholder:hover{background:#e8ecf0;border-color:#bcc5d0}
.card-header-row2{display:flex;align-items:center;gap:8px;width:100%}
.card-breadcrumb-chip{display:inline-block;padding:3px 10px;background:#f0f4f8;border:1px solid #d2d8e0;border-radius:12px;font-size:14px;color:#b0bac5;line-height:1.5;white-space:nowrap;transition:all .15s}
.card-breadcrumb-chip span{font-weight:700;color:#34495e}
.card-breadcrumb-chip.clickable{cursor:pointer}
.card-breadcrumb-chip.clickable:hover{background:#eef2ff;border-color:#c3d4ff}
.card-breadcrumb-chip.placeholder{color:#888;font-weight:500;font-size:12.5px}
.card-breadcrumb-chip.placeholder:hover{background:#e8ecf0;border-color:#bcc5d0}
.card-apa-row{padding:0 20px 19px 20px}
.card-apa{width:100%;color:#555;font-size:13.5px;margin-top:0;line-height:1.6;word-break:break-word;padding-left:2em;text-indent:-2em}
.btn-open,.btn-toggle{flex:0 0 auto;align-self:flex-start;padding:6px 14px;border:1px solid #c0c8d0;background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;transition:all .15s;color:#4a5568;height:30px;box-sizing:border-box}
.btn-open:hover,.btn-toggle:hover{background:#f0f4f8;border-color:#a0aab5;color:#2d3748}
.btn-print-icon{flex:0 0 auto;align-self:flex-start;padding:0 9px;border:1px solid #c0c8d0;background:#fff;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;transition:all .15s;height:30px;box-sizing:border-box}
.btn-print-icon:hover{background:#f0f4f8;border-color:#a0aab5}
.btn-print-icon:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.btn-modify-top{flex:0 0 auto;align-self:flex-start;padding:6px 14px;border:1px solid #c0c8d0;background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;transition:all .15s;color:#4a5568;height:30px;box-sizing:border-box}
.btn-modify-top:hover{background:#f0f4f8;border-color:#a0aab5;color:#2d3748}
.btn-cancel-new{flex:0 0 auto;align-self:flex-start;padding:8px 24px;border:1px solid #e53e3e;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;color:#e53e3e;transition:all .15s}
.btn-cancel-new:hover{background:#fff5f5;border-color:#c53030}

.card-detail{display:none;border-top:1px solid #e8ecf0;background:#f8f9fb;padding:0}
.card.expanded .card-detail{display:block}
.detail-body{display:flex;flex-direction:column;flex:1}
.cat-inline{padding:0 22px 14px}
.cat-inline-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cat-inline .btn-cat-toggle{padding:7px 16px;border:1px solid #4a7dff;background:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#4a7dff;white-space:nowrap;transition:all .15s;flex-shrink:0}
.cat-inline .btn-cat-toggle:hover{background:#eef2ff}
.cat-inline .btn-cat-toggle.active{background:#4a7dff;color:#fff}
.cat-elem-badge{display:inline-flex;align-items:center;padding:5px 12px;background:#eef2ff;border:1px solid #c3d4ff;border-radius:8px;font-size:13px;font-weight:600;color:#4a7dff;white-space:nowrap;flex-shrink:0}
.cat-inline .cat-drops{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.main.panel-full .cat-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main.panel-full .cat-inline-row{margin-bottom:0;flex-shrink:0}
.main.panel-full .cat-inline .cat-drops{display:flex;flex:1;min-width:0;gap:6px;flex-wrap:nowrap}
.detail-bottom-actions{display:flex;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid #e8ecf0;justify-content:flex-end}

.detail-center{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.field-group label{display:block;font-weight:700;font-size:12px;color:#718096;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field-group input,.field-group textarea{width:100%;border:1px solid #d2d8e0;border-radius:8px;padding:10px 14px;font-size:14.5px;font-family:inherit;resize:vertical;background:#fff;line-height:2.0;transition:border-color .15s,box-shadow .15s;scrollbar-width:none;-ms-overflow-style:none;text-align:justify;overflow-y:auto;overflow-x:hidden}
.field-group textarea::-webkit-scrollbar{display:none}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:#4a7dff;box-shadow:0 0 0 3px rgba(74,125,255,.12)}
.field-group input:read-only,.field-group textarea:read-only{background:#f1f3f5;color:#000;border-color:#e2e6ea}
.field-group textarea.tall{min-height:390px}
.field-group textarea.apa-short{min-height:52px}
.field-group textarea.medium{min-height:72px}
.field-group.comment-group{display:flex;flex-direction:column}
.field-group.comment-group textarea{min-height:120px}

.detail-right{width:280px;min-width:280px;padding:16px;overflow-y:auto;background:#f8f9fb;display:flex;flex-direction:column}
.detail-right h4{font-size:11px;color:#a0aec0;margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}

.cat-tree{margin-bottom:14px;overflow-y:auto;border:1px solid #d2d8e0;border-radius:8px;padding:8px;background:#fff;min-height:170px;max-height:390px;flex-shrink:1}
.cat-tree .ct-cat{font-weight:700;font-size:14px;cursor:pointer;padding:4px 6px 4px 6px;display:flex;align-items:center;gap:4px;border-radius:4px;transition:background .12s}
.cat-tree .ct-cat:hover{background:#f0f4f8}
.cat-tree .ct-cat .plus-btn{margin-left:auto;width:22px;height:22px;border:1px solid #c0c8d0;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;color:#555;transition:all .12s}
.cat-tree .ct-cat .plus-btn:hover{background:#e8eef6;border-color:#4a7dff;color:#4a7dff}
.cat-tree .ct-elem{padding:3px 6px 3px 22px;font-size:13px;color:#555;cursor:pointer;border-radius:4px;transition:background .12s}
.cat-tree .ct-elem:hover{background:#e8eef6}
.cat-tree .ct-elem.selected{background:#d0ddf0;font-weight:600;color:#2d3748}
.cat-tree.locked{pointer-events:none;opacity:.55;scrollbar-width:none;-ms-overflow-style:none}
.cat-tree.locked::-webkit-scrollbar{display:none}
.cat-tree.locked .ct-cat,.cat-tree.locked .ct-elem{cursor:default}

.cat-drop-row{display:flex;align-items:stretch;gap:6px;margin-bottom:0;flex:1;min-width:0}
.cat-drop-row select{flex:1;min-width:0;padding:8px 10px;border:1px solid #d2d8e0;border-radius:6px;font-size:13px;background:#fff;transition:border-color .15s;overflow:hidden;text-overflow:ellipsis}
.cat-drop-row select:focus{border-color:#4a7dff;outline:none}

let DB = { categories: [], elements: [], srgData: [], users: [], links: [] };

function doLogout() {
  showConfirmModal('로그아웃', '로그아웃 하시겠습니까?', '로그아웃', () => {
    const LOGOUT_STEPS = [
      '사용자 인증 정보 해제',
      'Preload Cache Data 삭제',
      'Category Data 정리',
      'Element Data 정리',
      'Serge Card Data 정리',
      'Link Data 정리',
      'PDF Data 정리',
      'Session Storage 초기화',
      '3초 후 Log-in 페이지로 이동'
    ];
    const TOTAL = LOGOUT_STEPS.length;

    let stepsHtml = LOGOUT_STEPS.map((s, i) =>
      `<div class="lo-step" id="lo${i+1}">
        <span class="lo-dot"></span>
        <span style="line-height:1.5">${s}</span>
        ${i < TOTAL - 1 ? '<span style="position:absolute;left:7px;top:18px;width:1.5px;height:100%;background:#e5e7eb"></span>' : ''}
      </div>`
    ).join('');

    const html = `
      <div class="modal-overlay" style="pointer-events:none">
        <div class="modal-box" style="text-align:left;width:360px">
          <h3 style="cursor:default;text-align:center;font-size:18px;margin-bottom:18px">로그아웃 하는 중...</h3>
          <div id="loSteps">${stepsHtml}</div>
        </div>
      </div>`;
    document.getElementById('modalContainer').innerHTML = html;

      const style = document.createElement('style');
      style.id = 'logoutStepStyles';
      style.textContent = `
        .lo-step{display:flex;align-items:center;font-size:12.5px;color:#cbd5e0;position:relative;padding-left:24px;min-height:26px;transition:color .3s}
        .lo-dot{position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;transition:all .3s;z-index:1}

        .lo-step.active .lo-dot{border-color:#4a7dff !important;background:#4a7dff !important;box-shadow:0 0 0 3px rgba(74,125,255,.15)}
        .lo-step.done{color:#9ca3af}
        .lo-step.done .lo-dot{border-color:#9ca3af;background:#9ca3af;box-shadow:none}
        .lo-step.countdown{color:#4a7dff !important;font-weight:700}

      `;
      document.head.appendChild(style);
    }

    function setLoStep(n) {
      for (let i = 1; i <= TOTAL; i++) {
        const el = document.getElementById('lo' + i);
        if (!el) continue;
        const dot = el.querySelector('.lo-dot');
        el.classList.remove('active', 'done');
        dot.textContent = '';
        if (i < n) {
          el.classList.add('done');
          dot.textContent = '✓';
          dot.style.color = '#fff';
          dot.style.fontSize = '8px';
          dot.style.fontWeight = '700';
        } else if (i === n) {
          el.classList.add('active');
        }
      }
    }

    async function runLogout() {
      const delay = ms => new Promise(r => setTimeout(r, ms));

      setLoStep(1);
      sessionStorage.removeItem('realab_user');
      currentUser = null;
      await delay(400);

      setLoStep(2);
      sessionStorage.removeItem('realab_preload');
      await delay(350);

      setLoStep(3);
      DB.categories = [];
      await delay(300);

      setLoStep(4);
      DB.elements = [];
      await delay(300);

      setLoStep(5);
      DB.srgData = [];
      await delay(350);

      setLoStep(6);
      if (DB.links) DB.links = [];
      await delay(300);

      setLoStep(7);
      pdfDataList = [];
      pdfCurrentRow = null;
      pdfCurrentIdx = -1;
      await delay(300);

      setLoStep(8);
      try { sessionStorage.clear(); } catch(e) {}
      await delay(350);
      for (let i = 1; i <= 8; i++) {
        const el = document.getElementById('lo' + i);
        const dot = el ? el.querySelector('.lo-dot') : null;
        if (el) { el.classList.remove('active'); el.classList.add('done'); }
        if (dot) { dot.textContent = '✓'; dot.style.color = '#fff'; dot.style.fontSize = '8px'; dot.style.fontWeight = '700'; }
      }

      const step8 = document.getElementById('lo' + TOTAL);
      const step8Label = step8 ? step8.querySelector('span:nth-child(2)') : null;
      const step8Dot = step8 ? step8.querySelector('.lo-dot') : null;
      step8.classList.remove('active');
      step8.classList.add('countdown');
      if (step8Dot) { step8Dot.textContent = '3'; step8Dot.style.color = '#fff'; step8Dot.style.fontSize = '9px'; step8Dot.style.fontWeight = '700'; }
      if (step8Label) step8Label.textContent = '3초 후 로그인 페이지로 이동';

      await delay(1000);
      if (step8Dot) step8Dot.textContent = '2';
      if (step8Label) step8Label.textContent = '2초 후 로그인 페이지로 이동';

      await delay(1000);
      if (step8Dot) step8Dot.textContent = '1';
      if (step8Label) step8Label.textContent = '1초 후 로그인 페이지로 이동';

      await delay(1000);

      step8.classList.remove('countdown');
      step8.classList.add('done');
      if (step8Dot) { step8Dot.textContent = '✓'; step8Dot.style.fontSize = '8px'; }
      if (step8Label) step8Label.textContent = '로그인 페이지로 이동';

      const h3 = document.querySelector('#modalContainer .modal-box h3');
      if (h3) { h3.textContent = '로그아웃 완료'; h3.style.color = '#9ca3af'; }

      await delay(300);
      window.location.href = 'index.html';
    }

    runLogout();
  }, 'btn-confirm', true);
}

async function gasFetch(url, options, retries = 1) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      const r = await fetch(url, { ...options, redirect: 'follow', mode: 'cors', signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + r.statusText);
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); }
      catch(_) {
        console.error('GAS 응답 (JSON 아님):', text.substring(0, 500));
        throw new Error('서버 응답 파싱 오류 (HTML 반환됨)');
      }
      if (!json.ok && json.error && json.error.includes('알 수 없는 action') && attempt < retries) {
        await new Promise(r => setTimeout(r, 500));
        continue;
      }
      return json;
    } catch(e) {
      const errMsg = e.name === 'AbortError' ? '서버 응답 시간 초과' : e.message;
      console.error('gasFetch 시도 ' + (attempt+1) + '/' + (retries+1) + ' 실패:', errMsg);
      if (attempt < retries) { await new Promise(r => setTimeout(r, 500)); continue; }
      throw e;
    }
  }
}
async function gasGet(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  return gasFetch(url, {});
}
async function gasPost(body) {
  return gasFetch(GAS_URL, {
    method: 'POST',

  });

    body: JSON.stringify(body)
  });
}

async function loadAll() {
  // 1) 캐시된 데이터가 있으면 먼저 화면에 표시
  let hasCachedView = false;
  try {
    const cached = sessionStorage.getItem('realab_dbcache');
    if (cached) {
      const cachedData = JSON.parse(cached);
      if (cachedData.ok) {
        applyDbData(cachedData);
        hasCachedView = true;
      }
    }
  } catch(_) {}

  // preload 데이터도 캐시로 활용
  if (!hasCachedView) {
    try {
      const preload = sessionStorage.getItem('realab_preload');
      if (preload) {
        const preloadData = JSON.parse(preload);
        if (preloadData.ok) {
          applyDbData(preloadData);
          hasCachedView = true;
        }
      }
    } catch(_) {}
  }

  // 2) 로딩 모달 표시 (배경에 기존 데이터가 보임)
  showLoading();
  try {
    let res = null;

    try {
      const preload = sessionStorage.getItem('realab_preload');
      if (preload) {
        sessionStorage.removeItem('realab_preload');
        res = JSON.parse(preload);
      }
    } catch(_) {}

    if (!res) {
      setLoadStep(1);
      await new Promise(r => setTimeout(r, 100));
      setLoadStep(2);
      res = await gasGet({ action: 'getAll' });
    }

    setLoadStep(3);
    if (res.ok) {
      applyDbData(res);
      setLoadStep(4);
      // 캐시에 최신 데이터 저장
      try { sessionStorage.setItem('realab_dbcache', JSON.stringify(res)); } catch(_) {}
    } else {
      toast('데이터 로드 실패: ' + (res.error || ''), 5000);
    }
  } catch (e) {
    console.error('loadAll 오류:', e);
    toast('서버 오류: ' + e.message + ' (재시도하려면 새로고침)', 5000);
  }
  hideLoading();
  // PDF 데이터 목록도 로드
  loadPdfDataList();
}

function formatApa(raw) {
  let s = escHtml(raw);
  s = s.replace(/((?:\(\d{4}[a-z]?\)\.\s|(?:Ed|Eds)\.\)\.\s))([A-Z][^.]+?)(\.|\s\()/g, function(m, pre, title, after) {
    return pre + '<i>' + title + '</i>' + after;
  });
  s = s.replace(/((?:\(\d{4}[a-z]?\)\.\s))([가-힣][^.]+?)(\.)/g, function(m, pre, title, after) {
    return pre + '<b>' + title + '</b>' + after;
  });
  s = s.replace(/(\.\s)([A-Z][A-Za-z\s&:]+),\s(\d+)(\(\d+\))?/g, function(m, dot, journal, vol, issue) {
    return dot + '<i>' + journal + ', ' + vol + '</i>' + (issue || '');
  });
  s = s.replace(/(\.\s)([가-힣][가-힣\s&]+),\s(\d+)(\(\d+\))?/g, function(m, dot, journal, vol, issue) {
    return dot + '<i>' + journal + ', ' + vol + '</i>' + (issue || '');
  });
  return s;
}

function renderStatistics() {
  const container = document.getElementById('statisticsView');

  let leftHtml = '<h3>📂 Card Statistics</h3>';
  leftHtml += '<div class="stat-tree">';

  // Build ordered categories: 00_기타 (category_99) first, then the rest
  const otherCat = DB.categories.find(c => c.category_id === 'category_99');
  const regularCats = DB.categories.filter(c => c.category_id !== 'category_99');
  const orderedCats = otherCat ? [otherCat, ...regularCats] : regularCats;

  orderedCats.forEach(cat => {
    const catCode = cat.category_id.replace('category_', '');
    const displayName = catCode + '_' + cat.category_name;
    const elems = getElementsForCategory(cat.category_id);
    const catCount = DB.srgData.filter(d => d.category_id === cat.category_id).length;
    const hasChildren = elems.length > 0;

    leftHtml += '<div class="st-node open">';
    leftHtml += '<div class="st-cat" onclick="this.parentElement.classList.toggle(\'open\')">';
    if (hasChildren) {
      leftHtml += '<span class="st-toggle">▶</span>';
    } else {
      leftHtml += '<span class="st-toggle" style="visibility:hidden">▶</span>';
    }
    leftHtml += '<span class="st-name" onclick="event.stopPropagation();highlightApaByFilter(\'category\',\'' + cat.category_id + '\',this)">' + escHtml(displayName) + '</span>';
    if (catCount > 0) {
      leftHtml += '<span class="st-leader"></span>';
      leftHtml += '<span class="st-count">' + catCount + '건</span>';
    }
    leftHtml += '</div>';

    if (hasChildren) {
      leftHtml += '<div class="st-children">';
      elems.forEach(elem => {
        const elemCode = elem.element_id.replace('element_', '');
        const elemCount = DB.srgData.filter(d => d.element_id === elem.element_id).length;
        leftHtml += '<div class="st-elem">';
        leftHtml += '<span class="st-name" onclick="highlightApaByFilter(\'element\',\'' + elem.element_id + '\',this)">' + elemCode + '_' + escHtml(elem.element_name) + '</span>';
        if (elemCount > 0) {
          leftHtml += '<span class="st-leader"></span>';
          leftHtml += '<span class="st-count">' + elemCount + '건</span>';
        }
        leftHtml += '</div>';
      });
      leftHtml += '</div>';
    }
    leftHtml += '</div>';
  });

  leftHtml += '</div>';

  // Collect unique APAs, filter empty, sort ascending
  const apaSet = new Set();
  DB.srgData.forEach(d => {
    const apa = (d.apa || '').trim();
    if (apa) apaSet.add(apa);
  });
  const apaList = [...apaSet].sort((a, b) => a.localeCompare(b, 'ko'));

  let rightHeaderHtml = '<h3>📚 참고문헌 (APA)</h3>';

  let rightBodyHtml = '<ul class="apa-list" id="statApaList">';
  apaList.forEach((apa, idx) => {
    rightBodyHtml += '<li data-apa="' + escHtml(apa) + '">' + formatApa(apa) + '</li>';
  });
  if (apaList.length === 0) {
    rightBodyHtml += '<li style="color:#a0aec0;text-indent:0;padding-left:12px">참고문헌이 없습니다.</li>';
  }
  rightBodyHtml += '</ul>';

  container.innerHTML = '<div class="statistics-view">' +
    '<div class="statistics-left">' + leftHtml + '</div>' +
    '<div class="statistics-right">' +
      '<div class="statistics-right-header">' + rightHeaderHtml + '</div>' +
      '<div class="statistics-right-body">' + rightBodyHtml + '</div>' +
    '</div>' +
    '</div>';
}
function highlightApaByFilter(type, id, clickedEl) {
  const allNames = document.querySelectorAll('.stat-tree .st-name');
  const wasActive = clickedEl.classList.contains('st-name-active');
  allNames.forEach(n => n.classList.remove('st-name-active'));

  const list = document.getElementById('statApaList');
  if (!list) return;
  const items = list.querySelectorAll('li[data-apa]');

  if (wasActive) {
    items.forEach(li => li.classList.remove('apa-highlight'));
    return;
  }

  clickedEl.classList.add('st-name-active');

  const matchingApas = new Set();
  DB.srgData.forEach(d => {
    const match = type === 'category' ? d.category_id === id : d.element_id === id;
    if (match) {
      const apa = (d.apa || '').trim();
      if (apa) matchingApas.add(apa);
    }
  });

  items.forEach(li => {
    const apaVal = li.getAttribute('data-apa');
    if (matchingApas.has(apaVal)) {
      li.classList.add('apa-highlight');
    } else {
      li.classList.remove('apa-highlight');
    }
  });
}

function generateNextSrgId() {
  let maxNum = 0;
  DB.srgData.forEach(d => {
    const m = String(d.srg_id).match(/srg_(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
  });
  return 'srg_' + String(maxNum + 1).padStart(5, '0');
}
function generateNextCategoryId() {
  let maxNum = 0;
  DB.categories.forEach(c => {
    if (c.category_id === 'category_99') return;
    const m = String(c.category_id).match(/category_(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxNum) maxNum = n; }
  });
  return 'category_' + String(maxNum + 1).padStart(2, '0');
}
function generateNextElementId(catId) {
  const catCode = catId.replace('category_', '');
  const prefix = 'element_' + catCode + '-';
  const existing = DB.elements.filter(e => e.category === catId);
  if (existing.length === 0) return prefix + '00';
  let maxSub = -1;
  existing.forEach(e => {
    const m = String(e.element_id).match(/element_\d+-(\d+)/);
    if (m) { const n = parseInt(m[1], 10); if (n > maxSub) maxSub = n; }
  });
  return prefix + String(maxSub + 1).padStart(2, '0');
}
function generateNextLinkNo() {
  let maxNum = 0;
  (DB.links || []).forEach(l => {
    const n = parseInt(l.no, 10);
    if (!isNaN(n) && n > maxNum) maxNum = n;
  });
  return String(maxNum + 1);
}

function showModal(html, screenCenter) {
  document.getElementById('modalContainer').innerHTML = html;
  const overlay = document.querySelector('#modalContainer .modal-overlay');
  if (overlay) {
    let overlayMouseDownTarget = null;
    overlay.addEventListener('mousedown', e => { overlayMouseDownTarget = e.target; });
    overlay.addEventListener('mouseup', e => {
      if (e.target === overlay && overlayMouseDownTarget === overlay) closeModal();
      overlayMouseDownTarget = null;
    });
  }
  const box = document.querySelector('#modalContainer .modal-box');
  if (box && screenCenter) {
    box.style.position = 'fixed';
    box.style.left = '50%';
    box.style.top = '50%';
    box.style.transform = 'translate(-50%, -50%)';
  } else {
    const mainEl = document.getElementById('main');
    if (box && mainEl) {
      const mainRect = mainEl.getBoundingClientRect();
      const centerX = mainRect.left + mainRect.width / 2;
      box.style.position = 'fixed';
      box.style.left = centerX + 'px';
      box.style.top = '50%';
      box.style.transform = 'translate(-50%, -50%)';
    }
  }
  const h3 = box ? box.querySelector('h3') : null;
  if (box && h3) {
    let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    h3.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseInt(box.style.left) || 0;
      origTop = parseInt(box.style.top) || 0;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function modalDrag(e) {
      if (!isDragging) return;
      box.style.left = (origLeft + e.clientX - startX) + 'px';
      box.style.top = (origTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', function modalDragEnd() {
      isDragging = false;
    });
  }
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function renderIconSelector(containerId, selectedIcon) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;margin-bottom:8px';
  LINK_ICONS.forEach(ic => {
    const div = document.createElement('div');
    div.textContent = ic.value;
    div.title = ic.label;
    div.dataset.icon = ic.value;
    const isSel = selectedIcon === ic.value;
    div.style.cssText = 'width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid ' + (isSel ? '#4a7dff' : '#e2e6ea') + ';border-radius:8px;cursor:pointer;font-size:20px;background:' + (isSel ? '#eef3ff' : '#fff') + ';transition:all .12s';
    div.addEventListener('click', function() {
      document.getElementById('modalLinkIcon').value = ic.value;
      wrap.querySelectorAll('div').forEach(function(d) { d.style.borderColor = '#e2e6ea'; d.style.background = '#fff'; });
      div.style.borderColor = '#4a7dff';
      div.style.background = '#eef3ff';
    });
    wrap.appendChild(div);
  });
  container.appendChild(wrap);
}

    listHtml += `<button onclick="reorderLinkMove(${idx},1)" style="width:28px;height:28px;border:1px solid #d2d8e0;border-radius:5px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center"${idx === items.length - 1 ? ' disabled style="opacity:.3;cursor:not-allowed"' : ''}>▼</button>`;
    listHtml += `</div>`;
  });
  const html = `
    <div class="modal-overlay">
      <div class="modal-box wide">
        <h3>🔗 Link 순서 관리</h3>
        <div style="max-height:400px;overflow-y:auto;margin-bottom:8px">${listHtml}</div>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">취소</button>
          <button class="btn-confirm" onclick="doReorderLinks()">저장</button>
        </div>
      </div>
    </div>`;
  showModal(html);
}
function reorderLinkMove(idx, dir) {
  const items = window._reorderLinks;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
  renderReorderModal();
}
async function doReorderLinks() {
  const items = window._reorderLinks;
  closeModal(); showLoading('순서 변경 중...');
  try {
    const res = await gasPost({ action: 'reorderLinks', links: items });
    if (res.ok) {
      DB.links = items.map((l, i) => ({ no: String(i + 1), site_name: l.site_name, url: l.url, icon: l.icon || '' }));
      buildSidebar();
      toast('순서 변경 완료!');
    } else { toast('순서 변경 실패: ' + (res.error || ''), 3000); }
  } catch(e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function openAddCatItemModal(srgId, catKey) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  const catId = d.category_id;
  const elemId = d.element_id;
  if (!catId && !elemId) { showAlertModal('알림', '먼저 Category / Element를 선택하세요.'); return; }
  const breadcrumb = makeBreadcrumb(d);
  const html = `

async function doAddCatItem(srgId, catKey, catId, elemId) {
  const val = document.getElementById('modalCatItemVal').value.trim();
  if (!val) { toast('값을 입력하세요.'); return; }
  closeModal(); showLoading('항목 추가 중...');
  const isNew = String(srgId).startsWith('NEW_');
  try {
    if (!isNew) {
      const res = await gasPost({ action: 'addCatItem', srg_id: srgId, catKey, value: val, category_id: catId, element_id: elemId });
      if (!res.ok) { toast('추가 실패: ' + (res.error || ''), 3000); hideLoading(); return; }

}

function toggleCatTree(event, catId) {
  event.stopPropagation();
  openCategories[catId] = !openCategories[catId];
  buildSidebar();
}
function onCatClick(event, catId, hasChildren) {
  if (catId === 'category_99' || catId === '__catMgmt__' || catId === '__linkMgmt__' || catId === '__elemMgmt__') {
    openCategories[catId] = !openCategories[catId];
    buildSidebar();
    return;
  }
  if (hasChildren && currentFilter && currentFilter.type === 'category' && currentFilter.id === catId && openCategories[catId]) {
    openCategories[catId] = false;
    buildSidebar();
    return;
  }
  if (hasChildren) openCategories[catId] = !openCategories[catId];
  filterCategory(catId); // guard is inside filterCategory
}

function isEditingCard() {
  const hasNewCard = DB.srgData.some(d => String(d.srg_id).startsWith('NEW_'));
  const hasModify = Object.keys(modifyModeCards).length > 0;
  return hasNewCard || hasModify;
}
function guardedNavigate(action) {

    showConfirmModal('편집 중', '작성 중인 내용이 있습니다. 이동하시겠습니까?\n변경 사항은 저장되지 않습니다.', '이동', () => {
      DB.srgData = DB.srgData.filter(d => !String(d.srg_id).startsWith('NEW_'));
      modifyModeCards = {};
      document.getElementById('btnNewCard').disabled = false;
      document.getElementById('btnNewCard').textContent = '+ 새 노트 추가';
      action();
    });

    action();

}

}

function getSrgNum(d) {
  const m = String(d.srg_id).match(/srg_(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}
function getFilteredData() {
  let data = [...DB.srgData];
  if (!currentFilter) {
    // All Notes: note id 내림차순, NEW_ 카드는 항상 최상단
    data.sort((a, b) => {
      const aNew = String(a.srg_id).startsWith('NEW_');
      const bNew = String(b.srg_id).startsWith('NEW_');
      if (aNew && !bNew) return -1;
      if (!aNew && bNew) return 1;
      return getSrgNum(b) - getSrgNum(a);
    });
    return data;
  }
  if (currentFilter.type === 'category') data = data.filter(d => d.category_id === currentFilter.id);
  else if (currentFilter.type === 'element') data = data.filter(d => d.element_id === currentFilter.id);
  // Category/Element: note id 오름차순, NEW_ 카드는 항상 최상단
  data.sort((a, b) => {
    const aNew = String(a.srg_id).startsWith('NEW_');
    const bNew = String(b.srg_id).startsWith('NEW_');
    if (aNew && !bNew) return -1;
    if (!aNew && bNew) return 1;
    return getSrgNum(a) - getSrgNum(b);
  });
  return data;
}

function makeBreadcrumb(d) {
  const parts = [];
  if (d.category_id) {
    const catCode = String(d.category_id).replace('category_', '');
    parts.push(`${catCode}_${getCategoryName(d.category_id)}`);
  }
  if (d.element_id) {
    const elemCode = String(d.element_id).replace('element_', '');
    parts.push(`${elemCode}_${getElementName(d.element_id)}`);
  }
  if (d['cat-01']) parts.push(d['cat-01']);
  if (d['cat-02']) parts.push(d['cat-02']);
  if (d['cat-03']) parts.push(d['cat-03']);
  if (d['cat-04']) parts.push(d['cat-04']);
  return parts.map(p => `<span>${escHtml(p)}</span>`).join(' &gt;&gt; ');
}
function makeBreadcrumbSplit(d) {
  const catElem = [];
  if (d.category_id) {
    const catCode = String(d.category_id).replace('category_', '');
    catElem.push(`${catCode}_${getCategoryName(d.category_id)}`);
  }
  if (d.element_id) {
    const elemCode = String(d.element_id).replace('element_', '');
    catElem.push(`${elemCode}_${getElementName(d.element_id)}`);
  }
  const cats = [];
  if (d['cat-01']) cats.push(d['cat-01']);
  if (d['cat-02']) cats.push(d['cat-02']);
  if (d['cat-03']) cats.push(d['cat-03']);
  if (d['cat-04']) cats.push(d['cat-04']);
  const line1 = catElem.map(p => `<span>${escHtml(p)}</span>`).join(' &gt;&gt; ');
  const line2 = cats.map(p => `<span>${escHtml(p)}</span>`).join(' &gt;&gt; ');
  return { line1, line2 };
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function formatNoteId(srgId) {
  const m = String(srgId).match(/srg_(\d+)/);
  if (m) return 'Note ID: ' + m[1];
  return srgId;
}

function getCatDropValues(catKey, catId, elemId) {
  return [...new Set(
    DB.srgData
      .filter(d => { if (elemId) return d.element_id === elemId; if (catId) return d.category_id === catId; return false; })
      .map(d => d[catKey])
      .filter(v => v && v.trim() !== '')
  )].sort();
}

function renderCards() {

  filtered.forEach(d => {
    const id = d.srg_id;

    html += `<div class="card${isExpanded ? ' expanded' : ''}" id="card-${escHtml(id)}">`;

    html += `<div class="card-header">`;

    const _hasCE = d.category_id && d.element_id;
    const _catObj = _hasCE ? DB.categories.find(c => c.category_id === d.category_id) : null;
    const _elemObj = _hasCE ? (DB.elements || []).find(e => e.element_id === d.element_id) : null;
    const _ceText = _hasCE ? `${_catObj ? _catObj.category_name : d.category_id}-${_elemObj ? _elemObj.element_name : d.element_id}` : '';

    html += `<div class="card-id-row" style="display:flex;align-items:center;gap:8px;width:100%">`;
    html += `<span class="card-id">${escHtml(formatNoteId(isNew ? d._displayId || id : id))}</span>`;
    if (isNew) {
      // 새 노트: Note ID 옆에 요소 선택 칩
      if (_hasCE) {
        html += `<span class="card-elem-chip" onclick="openCatTreeModal('${escHtml(id)}')">${escHtml(_ceText)}</span>`;
      } else {
        html += `<span class="card-elem-chip placeholder" onclick="openCatTreeModal('${escHtml(id)}')">요소 선택</span>`;

    }
    if (d.date) html += `<span class="card-date-chip">${escHtml(d.date)}</span>`;
    html += `<div style="flex:1"></div>`;
    // buttons on right of Note ID line
    const btnLabel = isNew ? 'Save' : (isModifyMode ? 'Save' : 'Modify');
    const btnAction = isNew
      ? `confirmSave('${escHtml(id)}')`
      : (isModifyMode ? `confirmSave('${escHtml(id)}')` : `modifyCard('${escHtml(id)}')`);
    if (isNew) {
      html += `<button class="btn-cancel-new" onclick="cancelNewCard('${escHtml(id)}')">Cancel</button>`;

      html += `<button class="btn-modify-top" style="background:#48bb78;color:#fff;border-color:#38a169" onclick="cancelModify('${escHtml(id)}')">Cancel</button>`;

      html += `<button class="btn-print-icon" onclick="confirmPrint('${escHtml(id)}')" title="Print" disabled>🖨</button>`;
    } else {
      if (isExpanded) {
        html += `<button class="btn-modify-top" onclick="modifyCard('${escHtml(id)}')">Modify</button>`;
      }
      html += `<button class="btn-toggle" onclick="toggleCard('${escHtml(id)}')">${isExpanded ? 'Close' : 'Open'}</button>`;
      html += `<button class="btn-print-icon" onclick="confirmPrint('${escHtml(id)}')" title="Print"${isExpanded ? '' : ' disabled'}>🖨</button>`;
    }
    html += `</div>`;
    const bcs = makeBreadcrumbSplit(d);
    const bcFull = makeBreadcrumb(d);
    if (!isNew) {
      // 인쇄용 Note ID (화면에서는 숨김)
      html += `<span class="card-id-print">${escHtml(formatNoteId(id))}</span>`;
      html += `<div class="card-bc-row">`;
      // 범주>>요소 부분을 칩 형태로 표시 (Modify 모드에서만 클릭 가능)
      if (bcs.line1) {
        if (isModifyMode) {
          html += `<span class="card-breadcrumb-chip clickable" onclick="openCatTreeModal('${escHtml(id)}')">${bcs.line1}</span>`;
        } else {
          html += `<span class="card-breadcrumb-chip">${bcs.line1}</span>`;
        }
      } else if (isModifyMode) {
        html += `<span class="card-breadcrumb-chip placeholder clickable" onclick="openCatTreeModal('${escHtml(id)}')">요소 선택</span>`;
      }
      // cat-01~04 하나의 칩으로 - 연결
      const catVals = [];
      for (let ci = 1; ci <= 4; ci++) {
        const cv = d['cat-0' + ci];
        if (cv) catVals.push(cv);
      }
      if (catVals.length) {
        html += `<span class="card-cat-chips"><span class="card-cat-chip">${catVals.map(c => escHtml(c)).join(' - ')}</span></span>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
    html += `</div>`;
    if (d.apa) {
      html += `<div class="card-apa-row">`;
      html += `<div class="card-apa">${escHtml(d.apa || '')}</div>`;
      html += `</div>`;
    }

    html += `<div class="card-detail">`;
    html += `<div class="detail-body">`;

    const ro = !isModifyMode ? ' readonly' : '';
    html += `<div class="detail-center">`;
    html += `<div class="field-group"><textarea class="apa-short" data-field="apa" placeholder="APA"${ro}>${escHtml(d.apa)}</textarea></div>`;
    html += `<div class="field-group"><textarea class="medium" data-field="context" placeholder="Context"${ro}>${escHtml(d.context)}</textarea></div>`;
    html += `<div class="field-group"><textarea class="tall" data-field="text" placeholder="Text"${ro}>${escHtml(d.text)}</textarea></div>`;
    html += `<div class="field-group comment-group"><textarea class="comment-tall" data-field="comment" placeholder="Comment"${ro}>${escHtml(d.comment)}</textarea></div>`;
    html += `</div>`;

    const locked = !isModifyMode;

    html += `<div class="cat-inline">`;
    html += `<div class="cat-drops">`;
    html += buildCatDropdowns(d, locked);
    html += `</div>`;
    html += `</div>`;

    // bottom action buttons
    if (isNew || isModifyMode) {
      html += `<div class="detail-bottom-actions">`;
      if (isNew) {
        html += `<button class="btn-open" onclick="confirmDelete('${escHtml(id)}')" disabled style="opacity:.4;cursor:not-allowed;pointer-events:none">Delete</button>`;
      } else {
        html += `<button class="btn-open" style="color:#e53e3e;border-color:#e53e3e" onclick="confirmDelete('${escHtml(id)}')">Delete</button>`;
      }
      html += `<button class="btn-open" style="color:#fff;background:linear-gradient(135deg,#667eea,#5a67d8);border-color:transparent" onclick="${btnAction}">${btnLabel}</button>`;
      html += `</div>`;
    }

    html += `</div>`; // detail-body
    html += `</div>`; // card-detail
    html += `</div>`; // card
  });

  list.innerHTML = html;
  expandedCardIds.forEach(eid => {
    const el = document.getElementById('card-' + eid);
    if (el) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setupAutoResize(el);
        });
      });
    }
  });
}

function buildCatTree(d, locked) {
  let html = `<div class="cat-tree${locked ? ' locked' : ''}">`;
  DB.categories.forEach(cat => {
    if (cat.category_id === 'category_99') return;
    const catCode = cat.category_id.replace('category_', '');
    const isSelected = d.category_id === cat.category_id;
    html += `<div class="ct-cat${isSelected ? ' ct-cat-selected' : ''}" style="${isSelected ? 'color:#4a7dff' : ''}">`;
    html += `<span onclick="setCatElem('${d.srg_id}','${cat.category_id}','')">${catCode}_${escHtml(cat.category_name)}</span>`;
    if (!locked) {
      html += `<span class="plus-btn" onclick="event.stopPropagation();openAddElementForCategory('${d.srg_id}','${cat.category_id}')" title="새 Element 추가">+</span>`;
    }
    html += `</div>`;

    const elems = getElementsForCategory(cat.category_id);
    elems.forEach(elem => {
      const elemCode = elem.element_id.replace('element_', '');
      const eSelected = d.element_id === elem.element_id;
      html += `<div class="ct-elem${eSelected ? ' selected' : ''}"`;
      if (!locked) html += ` onclick="setCatElem('${d.srg_id}','${cat.category_id}','${elem.element_id}')"`;
      html += `>${elemCode}_${escHtml(elem.element_name)}</div>`;
    });
  });
  html += '</div>';
  return html;
}

function buildCatDropdowns(d, locked) {
  let html = '';
  for (let i = 1; i <= 4; i++) {
    const key = 'cat-0' + i;
    const val = d[key] || '';
    const options = getCatDropValues(key, d.category_id, d.element_id);
    html += `<div class="cat-drop-row">`;
    html += `<select data-catdrop="${key}"${locked ? ' disabled' : ''} onchange="toggleCatBtn(this,'${d.srg_id}','${key}')">`;
    html += `<option value="">Cat-0${i}</option>`;
    options.forEach(opt => { html += `<option value="${escHtml(opt)}"${val === opt ? ' selected' : ''}>${escHtml(opt)}</option>`; });
    if (val && !options.includes(val)) html += `<option value="${escHtml(val)}" selected>${escHtml(val)}</option>`;
    html += `</select>`;
    if (!locked && val) {
      html += `<span class="plus-btn" title="항목 수정" onclick="openModifyCatItemModal('${d.srg_id}','${key}')" style="font-size:11px;font-weight:700">M</span>`;
    } else {
      html += `<span class="plus-btn${locked ? ' locked' : ''}" title="새 항목 추가" onclick="openAddCatItemModal('${d.srg_id}','${key}')">+</span>`;
    }
    html += `</div>`;
  }
  return html;
}

function toggleCatBtn(sel, srgId, catKey) {
  const row = sel.closest('.cat-drop-row');
  const btn = row ? row.querySelector('.plus-btn') : null;
  if (!btn || btn.classList.contains('locked')) return;
  if (sel.value) {
    btn.textContent = 'M';
    btn.title = '항목 수정';
    btn.style.fontSize = '11px';
    btn.style.fontWeight = '700';
    btn.setAttribute('onclick', "openModifyCatItemModal('" + srgId + "','" + catKey + "')");
  } else {
    btn.textContent = '+';
    btn.title = '새 항목 추가';
    btn.style.fontSize = '';
    btn.style.fontWeight = '';
    btn.setAttribute('onclick', "openAddCatItemModal('" + srgId + "','" + catKey + "')");
  }
}

function openModifyCatItemModal(srgId, catKey) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  const cardEl = document.getElementById('card-' + srgId);
  const sel = cardEl ? cardEl.querySelector('[data-catdrop="' + catKey + '"]') : null;
  const currentVal = sel ? sel.value : (d[catKey] || '');
  if (!currentVal) { toast('선택된 값이 없습니다.'); return; }
  const displayKey = catKey.replace('cat-0','Cat-0');
  const html = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>${displayKey} 항목 수정</h3>
        <label>현재 명칭</label>
        <input type="text" id="modalCatItemOld" value="${escHtml(currentVal)}" readonly style="background:#f1f3f5;color:#6c757d">
        <label>새 명칭</label>
        <input type="text" id="modalCatItemNew" value="${escHtml(currentVal)}">
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">취소</button>
          <button class="btn-confirm" onclick="doModifyCatItem('${srgId}','${catKey}')">수정</button>
        </div>
      </div>
    </div>`;
  showModal(html);
  setTimeout(() => { const inp = document.getElementById('modalCatItemNew'); inp.focus(); inp.select(); }, 100);
}

async function doModifyCatItem(srgId, catKey) {
  const oldVal = document.getElementById('modalCatItemOld').value.trim();
  const newVal = document.getElementById('modalCatItemNew').value.trim();
  if (!newVal) { toast('새 값을 입력하세요.'); return; }
  if (oldVal === newVal) { closeModal(); return; }
  const d = DB.srgData.find(x => x.srg_id === srgId);
  closeModal();
  showLoading('항목 수정 데이터 준비 중...');
  try {
    updateLoadingMsg('서버에 수정 요청 전송 중...');
    await new Promise(r => setTimeout(r, 150));
    const res = await gasPost({
      action: 'renameCatItem',
      catKey, oldValue: oldVal, newValue: newVal,
      category_id: d ? d.category_id : '',
      element_id: d ? d.element_id : ''
    });
    if (res.ok) {
      updateLoadingMsg('서버에서 최신 데이터 불러오는 중...');
      await new Promise(r => setTimeout(r, 150));
      const freshRes = await gasGet({ action: 'getAll' });
      if (freshRes.ok) {
        updateLoadingMsg('로컬 데이터 업데이트 중...');
        await new Promise(r => setTimeout(r, 150));
        DB = freshRes;
        if (!DB.links) DB.links = [];
        DB.links = DB.links.map(l => {
          if (l['no.'] !== undefined && l.no === undefined) { l.no = l['no.']; }
          return l;
        });
        updateLoadingMsg('화면 갱신 중...');
        await new Promise(r => setTimeout(r, 150));
        skipSnapshot = true;
        buildSidebar();
        renderCards();
      }
      toast('항목 수정 완료!');
    } else { toast('수정 실패: ' + (res.error || ''), 3000); }
  } catch(e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function setCatElem(srgId, catId, elemId) {
  const d = DB.srgData.find(x => x.srg_id === srgId);
  if (!d) return;
  d.category_id = catId;
  d.element_id = elemId;
  renderCards();
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const detail = card.querySelector('.card-detail');
  if (!detail) return;

  if (expandedCardIds.has(id)) {
    // 닫기 애니메이션
    const btn = card.querySelector('.btn-toggle');
    if (btn) btn.textContent = 'Open';
    // Modify 버튼 제거
    const modBtn = card.querySelector('.btn-modify-top');
    if (modBtn) modBtn.remove();
    // Print 비활성화
    const printBtn = card.querySelector('.btn-print-icon');
    if (printBtn) printBtn.disabled = true;
    const h = detail.scrollHeight;
    detail.style.overflow = 'hidden';
    detail.style.height = h + 'px';
    detail.offsetHeight;
    detail.style.transition = 'height 0.3s ease';
    detail.style.height = '0px';
    const onEnd = () => {
      detail.removeEventListener('transitionend', onEnd);
      expandedCardIds.delete(id);
      delete modifyModeCards[id];
      card.classList.remove('expanded');
      detail.style.overflow = '';
      detail.style.height = '';
      detail.style.transition = '';
    };
    detail.addEventListener('transitionend', onEnd);
  } else {
    // 열기 애니메이션
    expandedCardIds.add(id);
    card.classList.add('expanded');
    const btn = card.querySelector('.btn-toggle');
    if (btn) {
      btn.textContent = 'Close';
      // Modify 버튼 추가
      const modBtn = document.createElement('button');
      modBtn.className = 'btn-modify-top';
      modBtn.textContent = 'Modify';
      modBtn.onclick = () => modifyCard(id);
      btn.parentNode.insertBefore(modBtn, btn);
    }
    // Print 활성화
    const printBtn = card.querySelector('.btn-print-icon');
    if (printBtn) printBtn.disabled = false;
    detail.style.overflow = 'hidden';
    detail.style.height = '0px';
    detail.offsetHeight;
    const targetH = detail.scrollHeight;
    detail.style.transition = 'height 0.3s ease';
    detail.style.height = targetH + 'px';
    const onEnd = () => {
      detail.removeEventListener('transitionend', onEnd);
      detail.style.overflow = '';
      detail.style.height = '';
      detail.style.transition = '';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setupAutoResize(card);
        });
      });
    };
    detail.addEventListener('transitionend', onEnd);
  }
}
function cancelNewCard(id) {
  showConfirmModal('작성 취소', '노트 작성을 취소하시겠습니까?', '확인', () => {
    DB.srgData = DB.srgData.filter(d => d.srg_id !== id);
    expandedCardIds.delete(id);
    document.getElementById('btnNewCard').disabled = false;
    document.getElementById('btnNewCard').textContent = '+ 새 노트 추가';
    renderCards();

}

function gatherCardData(srgId) {
  const cardEl = document.getElementById('card-' + srgId);
  if (!cardEl) return null;
  const get = (sel) => { const el = cardEl.querySelector(sel); return el ? el.value : ''; };
  const d = DB.srgData.find(x => x.srg_id === srgId);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  return {
    srg_id: srgId, apa: get('[data-field="apa"]'), context: get('[data-field="context"]'),
    text: get('[data-field="text"]'), comment: get('[data-field="comment"]'),
    category_id: d ? d.category_id : '', element_id: d ? d.element_id : '',
    'cat-01': get('[data-catdrop="cat-01"]'), 'cat-02': get('[data-catdrop="cat-02"]'),
    'cat-03': get('[data-catdrop="cat-03"]'), 'cat-04': get('[data-catdrop="cat-04"]'),
    date: dateStr
  };
}

let skipSnapshot = false;
function snapshotEditingCards() {
  if (skipSnapshot) { skipSnapshot = false; return; }
  const editingIds = Object.keys(modifyModeCards);
  DB.srgData.forEach(d => {
    if (String(d.srg_id).startsWith('NEW_') && !editingIds.includes(d.srg_id)) {
      editingIds.push(d.srg_id);
    }
  });
  editingIds.forEach(srgId => {
    const cardEl = document.getElementById('card-' + srgId);
    if (!cardEl) return;
    const d = DB.srgData.find(x => x.srg_id === srgId);
    if (!d) return;
    const get = (sel) => { const el = cardEl.querySelector(sel); return el ? el.value : ''; };
    d.apa = get('[data-field="apa"]');
    d.context = get('[data-field="context"]');
    d.text = get('[data-field="text"]');
    d.comment = get('[data-field="comment"]');
    const cat01 = get('[data-catdrop="cat-01"]'); if (cat01) d['cat-01'] = cat01;
    const cat02 = get('[data-catdrop="cat-02"]'); if (cat02) d['cat-02'] = cat02;
    const cat03 = get('[data-catdrop="cat-03"]'); if (cat03) d['cat-03'] = cat03;
    const cat04 = get('[data-catdrop="cat-04"]'); if (cat04) d['cat-04'] = cat04;
  });
}

function validateCard(srgId) {
  const row = gatherCardData(srgId);
  if (!row) return null;
  const missing = [];
  if (!row.apa.trim()) missing.push('APA');
  if (!row.context.trim()) missing.push('Context');
  if (!row.text.trim()) missing.push('Text');
  if (!row.comment.trim()) missing.push('Comment');
  if (missing.length > 0) { showAlertModal('입력 필요', missing.join(', ') + ' 항목을 입력해 주세요.'); return null; }
  return row;
}

function confirmSave(srgId) {
  const row = validateCard(srgId);
  if (!row) return;
  showConfirmModal('저장 확인', '이 노트를 저장하시겠습니까?', '저장', () => doSaveCard(srgId));
}
async function doSaveCard(srgId) {
  const row = gatherCardData(srgId);
  if (!row) return;
  const isNew = srgId.startsWith('NEW_');
  showLoading('노트 데이터 수집 중...');
  await new Promise(r => setTimeout(r, 200));
  try {
    const action = isNew ? 'create' : 'update';
    if (isNew) {
      const d = DB.srgData.find(x => x.srg_id === srgId);
      row.srg_id = d && d._displayId ? d._displayId : generateNextSrgId();
    }
    updateLoadingMsg('서버에 데이터 전송 중...');
    await new Promise(r => setTimeout(r, 150));
    const payload = { action, row };
    const res = isNew
      ? await gasFetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) }, 0)
      : await gasPost(payload);
    if (res.ok) {
      updateLoadingMsg('로컬 데이터 업데이트 중...');
      await new Promise(r => setTimeout(r, 150));
      const finalId = res.srg_id || row.srg_id;
      if (isNew) {
        const idx = DB.srgData.findIndex(x => x.srg_id === srgId);
        if (idx >= 0) {
          DB.srgData[idx] = { ...row, srg_id: finalId, date: row.date };
          delete DB.srgData[idx]._displayId;
        }
      } else {
        const idx = DB.srgData.findIndex(x => x.srg_id === srgId);
        if (idx >= 0) DB.srgData[idx] = { ...row, date: row.date };
      }
      updateLoadingMsg('화면 갱신 중...');
      await new Promise(r => setTimeout(r, 150));
      expandedCardIds.delete(srgId);
      expandedCardIds.add(finalId);
      delete modifyModeCards[srgId];
      document.getElementById('btnNewCard').disabled = false;
      document.getElementById('btnNewCard').textContent = '+ 새 노트 추가';
      buildSidebar(); renderCards();
      toast('저장 완료!');
    } else { toast('저장 실패: ' + (res.error || ''), 3000); }
  } catch (e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function confirmDelete(srgId) {
  showConfirmModal('삭제 확인', '이 노트를 삭제하시겠습니까?\n' + formatNoteId(srgId), '삭제', () => doDeleteCard(srgId), 'btn-danger');

async function doDeleteCard(srgId) {

      buildSidebar(); renderCards();
      toast('삭제 완료!');

  } catch (e) { toast('오류: ' + e.message, 3000); }
  hideLoading();
}

function cancelModify(srgId) {

function confirmPrint(srgId) {
  expandedCardIds.add(srgId); renderCards();
  setTimeout(() => {
    const card = document.getElementById('card-' + srgId);
    if (!card) return;
    function scrollToCardTop() {
      const mainEl = document.getElementById('main');
      const wrap = document.getElementById('btnNewCardWrap');
      if (!mainEl) return;
      const wrapH = wrap ? wrap.offsetHeight : 0;
      const cardTop = card.offsetTop;
      mainEl.scrollTop = cardTop - wrapH;
    }
    scrollToCardTop();
    const textareas = card.querySelectorAll('.detail-center textarea:not(.apa-short)');
    const mirrors = [];
    textareas.forEach(ta => {
      const div = document.createElement('div');
      div.className = 'print-mirror';
      div.textContent = ta.value;
      div.dataset.field = ta.dataset.field;
      div.style.cssText = 'display:none';
      ta.parentNode.insertBefore(div, ta.nextSibling);
      mirrors.push({ ta, div });
    });
    const apaTa = card.querySelector('.detail-center textarea.apa-short');
    const apaGroup = apaTa ? apaTa.closest('.field-group') : null;
    if (apaGroup) apaGroup.classList.add('print-hide-apa');
    card.classList.add('print-ready');
    setTimeout(() => {
      window.print();
      mirrors.forEach(m => m.div.remove());
      card.classList.remove('print-ready');
      if (apaGroup) apaGroup.classList.remove('print-hide-apa');
      scrollToCardTop();
      requestAnimationFrame(scrollToCardTop);
    }, 200);
  }, 300);
}

let newCardCounter = 0;
let isInitialLoad = true;
function openNewCard() {
  newCardCounter++;
  const tempId = 'NEW_' + newCardCounter;
  const displayId = generateNextSrgId();
  DB.srgData.unshift({
    srg_id: tempId, _displayId: displayId,
    apa: '', context: '', text: '', comment: '',
    category_id: currentFilter?.type === 'category' ? currentFilter.id : '',
    element_id:  currentFilter?.type === 'element' ? currentFilter.id : '',
    'cat-01': '', 'cat-02': '', 'cat-03': '', 'cat-04': ''
  });
  expandedCardIds.add(tempId);
  const btn = document.getElementById('btnNewCard');
  btn.disabled = true;
  btn.textContent = '새 노트 작성 중...';
  renderCards();
  // 새 카드로 스크롤 + APA 포커스
  setTimeout(() => {
    const mainEl = document.getElementById('main');
    if (mainEl) {
      const start = mainEl.scrollTop;
      const duration = 400;
      const startTime = performance.now();
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        mainEl.scrollTop = start * (1 - ease);
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          mainEl.scrollTop = 0;
          const newCard = document.getElementById('card-' + tempId);
          if (newCard) {
            const apaTa = newCard.querySelector('[data-field="apa"]');
            if (apaTa) apaTa.focus({ preventScroll: true });
          }
        }
      }
      requestAnimationFrame(step);
    }
  }, 50);
}

function autoResizeTextarea(ta) {
  const cs = window.getComputedStyle(ta);
  const minH = parseInt(cs.minHeight) || 36;
  const bt = parseInt(cs.borderTopWidth) || 0;
  const bb = parseInt(cs.borderBottomWidth) || 0;
  const prevOverflow = ta.style.overflow;
  ta.style.overflow = 'hidden';
  ta.style.height = '0px';
  const need = ta.scrollHeight + bt + bb;
  ta.style.height = Math.max(minH, need) + 'px';
  ta.style.overflow = prevOverflow;
}

function setupAutoResize(cardEl) {
  if (!cardEl) return;
  const textareas = cardEl.querySelectorAll('.detail-center textarea');
  textareas.forEach(ta => {
    autoResizeTextarea(ta);
    ta.removeEventListener('input', ta._autoResizeHandler);
    ta._autoResizeHandler = () => { autoResizeTextarea(ta); syncRightPanel(cardEl); };
    ta.addEventListener('input', ta._autoResizeHandler);
  });
  syncRightPanel(cardEl);
  scrollCatTreeToSelected(cardEl);
}

window.addEventListener('resize', (function() {
  let timer;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      if (expandedCardIds.size === 0) return;
      expandedCardIds.forEach(eid => {
        const card = document.getElementById('card-' + eid);
        if (!card) return;
        const textareas = card.querySelectorAll('.detail-center textarea');
        textareas.forEach(ta => autoResizeTextarea(ta));
        syncRightPanel(card);
      });
    }, 100);
  };
})());

function scrollCatTreeToSelected(cardEl) {
  if (!cardEl) return;
  const catTree = cardEl.querySelector('.cat-tree');
  if (!catTree) return;
  const selectedCat = catTree.querySelector('.ct-cat-selected');
  if (selectedCat) {
    const treeTop = catTree.getBoundingClientRect().top;
    const selTop = selectedCat.getBoundingClientRect().top;
    const treeH = catTree.clientHeight;
    const offset = selTop - treeTop - treeH / 2 + selectedCat.offsetHeight / 2;
    catTree.scrollTop += offset;
  }
}

function syncRightPanel(cardEl) {
  if (!cardEl) return;
  const center = cardEl.querySelector('.detail-center');
  const right = cardEl.querySelector('.detail-right');
  if (!center || !right) return;
  const commentTa = center.querySelector('[data-field="comment"]');
  if (!commentTa) return;
  const centerBottom = commentTa.getBoundingClientRect().bottom;
  const actions = right.querySelector('.detail-right-actions');
  if (!actions) return;
  const actionsBottom = actions.getBoundingClientRect().bottom;
  const diff = centerBottom - actionsBottom;
  const currentMarginTop = parseInt(window.getComputedStyle(actions).marginTop) || 16;
  if (diff > 0) {
    actions.style.marginTop = (currentMarginTop + diff) + 'px';
  }
}

/* 패널 상태: 'pdfFull' | 'normal' | 'mainFull' */
let panelState = 'normal';
function setPanelState(state) {
  const wrap = document.getElementById('pdfWrap');
  const main = document.getElementById('main');
  const btnM = document.getElementById('btnExpandMain');
  const btnP = document.getElementById('btnExpandPdf');
  const divider = document.getElementById('panelDivider');
  const prevState = panelState;
  panelState = state;
  // reset button states
  btnM.classList.remove('active','hidden');
  btnP.classList.remove('active','hidden');
  divider.classList.remove('has-visible','state-mainFull','state-pdfFull');
  // clear any sidebar-toggle overrides
  wrap.style.width = '';
  main.style.flex = '';
  main.style.width = '';
  if (state === 'normal') {
    main.classList.remove('collapsed','panel-full');
    wrap.classList.remove('expanded');
    wrap.classList.add('open');
    // re-apply sidebar-toggle width if sidebar is collapsed
    const sb = document.getElementById('sidebarPanel');
    if (sb && sb.classList.contains('collapsed')) {
      wrap.style.width = 'calc(55vw + 257px)';
    }
  } else if (state === 'pdfFull') {
    // disable ALL transitions to prevent expand-then-shrink flash
    main.style.transition = 'none';
    wrap.style.transition = 'none';
    main.classList.remove('panel-full');
    main.classList.add('collapsed');
    wrap.classList.add('open','expanded');
    // force reflow then restore transitions
    main.offsetHeight;
    wrap.offsetHeight;
    main.style.transition = '';
    wrap.style.transition = '';
    btnP.classList.add('hidden');
    divider.classList.add('has-visible','state-pdfFull');
  } else if (state === 'mainFull') {
    wrap.classList.remove('open','expanded');
    main.classList.remove('collapsed');
    main.classList.add('panel-full');
    btnM.classList.add('hidden');
    divider.classList.add('has-visible','state-mainFull');
  }
  // re-trigger textarea auto-resize after panel width change
  requestAnimationFrame(() => {
    expandedCardIds.forEach(eid => {
      const el = document.getElementById('card-' + eid);
      if (el) setupAutoResize(el);
    });
    if (typeof alignNavToButtons === 'function') alignNavToButtons();
  });
}

function loadPdfUrl() {
  let url = document.getElementById('pdfUrlInput').value.trim();
  if (!url) {
    showPdfAlert('PDF URL이 비어 있습니다.', 'PDF URL을 입력하거나, 데이터에 URL이 등록되어 있는지 확인해주세요.');
    return;
  }
  if (!url.startsWith('http')) url = 'https://' + url;
  // 기본적인 URL 유효성 검사
  try {
    new URL(url);
  } catch(_) {
    showPdfAlert('유효하지 않은 URL입니다.', '입력된 URL: ' + url + '\n\n올바른 형식의 URL을 입력해주세요.');
    return;
  }
  const body = document.getElementById('pdfBody');
  // Google Drive 공유 링크 변환
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
  if (driveMatch) {
    url = 'https://drive.google.com/file/d/' + driveMatch[1] + '/preview';
  }
  // 로딩 오버레이 표시
  const overlay = document.getElementById('pdfLoadingOverlay');
  // placeholder 제거 후 overlay + iframe 구성
  const placeholder = body.querySelector('.pdf-placeholder');
  if (placeholder) placeholder.remove();
  overlay.classList.add('show');
  // 기존 iframe 제거
  const oldIframe = body.querySelector('iframe');
  if (oldIframe) oldIframe.remove();
  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.allowFullscreen = true;
  iframe.style.cssText = 'width:100%;height:100%';
  iframe.onload = function() { overlay.classList.remove('show'); };
  body.appendChild(iframe);
  // Load 버튼 비활성화
  document.getElementById('pdfLoadBtn').disabled = true;
  // last_access 업데이트
  if (pdfCurrentRow) {
    const now = new Date();
    const ts = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0')
      + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    pdfCurrentRow.last_access = ts;
    savePdfField(pdfCurrentRow.no, 'last_access', ts);
    const chipEl = document.getElementById('pdfLastAccess');
    chipEl.querySelector('.chip-text').textContent = ts;
    chipEl.classList.add('visible');
  }
}

/* === PDF Data (analysis_data) === */
let pdfDataList = [];
let pdfCurrentRow = null; // { no, apa, url, ... }
let pdfCurrentIdx = -1;

function applyPdfList(list) {
  pdfDataList = list;
  if (pdfDataList.length > 0) {
    let latestIdx = 0;
    let latestTs = '';
    pdfDataList.forEach((r, i) => {
      if (r.last_access && r.last_access > latestTs) {
        latestTs = r.last_access;
        latestIdx = i;
      }
    });
    pdfNavGoTo(latestIdx);
  } else {
    pdfNavUpdateUI();
  }
}

async function loadPdfDataList() {
  // preload 데이터가 있으면 사용 (로그인에서 미리 로드)
  try {
    const preload = sessionStorage.getItem('realab_pdfpreload');
    if (preload) {
      sessionStorage.removeItem('realab_pdfpreload');
      const list = JSON.parse(preload);
      if (Array.isArray(list)) {
        applyPdfList(list);
        return;
      }
    }
  } catch(_) {}

  // preload 없으면 서버에서 직접 로드 (새로고침 등)
  try {
    const res = await gasPdfPost({ action: 'getPdfList' });
    console.log('loadPdfDataList response:', JSON.stringify(res).substring(0, 500));
    const list = res && (res.data || res.result);
    if (list && Array.isArray(list)) {
      applyPdfList(list);
      toast('PDF 목록 로드 완료 (' + pdfDataList.length + '건)');
    } else {
      console.warn('loadPdfDataList: unexpected response format', res);
      toast('PDF 목록 로드 실패: 응답 형식 오류');
    }
  } catch(e) {
    console.error('loadPdfDataList error', e);
    toast('PDF 목록 로드 오류: ' + e.message);
  }
}

function pdfNavGoTo(idx) {
  if (idx < 0 || idx >= pdfDataList.length) return;
  pdfCurrentIdx = idx;
  setPdfRow(pdfDataList[idx]);
  pdfNavUpdateUI();
}

function pdfNavMove(dir) {
  const newIdx = pdfCurrentIdx + dir;
  if (newIdx < 0 || newIdx >= pdfDataList.length) return;
  pdfNavGoTo(newIdx);
}

function pdfNavUpdateUI() {
  const noEl = document.getElementById('pdfNavNo');
  const prevBtn = document.getElementById('pdfNavPrev');
  const nextBtn = document.getElementById('pdfNavNext');
  if (pdfCurrentRow) {
    const num = parseInt(pdfCurrentRow.no, 10) || 1;
    noEl.value = String(num).padStart(3, '0');
  } else {
    noEl.value = '001';
  }
  prevBtn.disabled = pdfCurrentIdx <= 0;
  nextBtn.disabled = pdfCurrentIdx >= pdfDataList.length - 1;
}

async function pdfNavGoToByNo() {
  const noEl = document.getElementById('pdfNavNo');
  const targetNo = parseInt(noEl.value, 10);
  if (isNaN(targetNo) || targetNo < 1) {
    toast('유효한 번호를 입력하세요.');
    pdfNavUpdateUI();
    return;
  }
  // if list not loaded yet, load first
  if (pdfDataList.length === 0) {
    toast('PDF 목록 로딩 중...');
    await loadPdfDataList();
  }
  // find row by no (compare as numbers, handle string "001" and number 1)
  const idx = pdfDataList.findIndex(r => parseInt(r.no, 10) === targetNo);
  if (idx >= 0) {
    pdfNavGoTo(idx);
  } else {
    toast('No. ' + String(targetNo).padStart(3, '0') + ' 데이터가 없습니다.');
    pdfNavUpdateUI();
  }
}

function setPdfRow(row) {
  pdfCurrentRow = row;
  const apaInput = document.getElementById('pdfApaInput');
  const urlInput = document.getElementById('pdfUrlInput');
  apaInput.value = row ? (row.apa || '') : '';
  urlInput.value = row ? (row.url || '') : '';
  apaInput.readOnly = true;
  urlInput.readOnly = true;
  apaInput.classList.remove('editing');
  urlInput.classList.remove('editing');
  // reset Modify buttons text/style
  document.querySelectorAll('.pdf-header-row .btn-modify').forEach(b => {
    const label = b.getAttribute('data-label');
    b.textContent = label + '(mod.)';
    b.style.background = '';
  });
  // last_access 표시 (C열)
  const lastAccEl = document.getElementById('pdfLastAccess');
  if (row && row.last_access) {
    lastAccEl.querySelector('.chip-text').textContent = row.last_access;
    lastAccEl.classList.add('visible');
  } else {
    lastAccEl.querySelector('.chip-text').textContent = '';
    lastAccEl.classList.remove('visible');
  }
  // Load 버튼 활성화 (no 변경시)
  document.getElementById('pdfLoadBtn').disabled = false;
}

function pdfFieldModify(field) {
  const input = field === 'apa' ? document.getElementById('pdfApaInput') : document.getElementById('pdfUrlInput');
  const btn = input.closest('.pdf-header-row').querySelector('.btn-modify');
  if (input.readOnly) {
    input.readOnly = false;
    input.classList.add('editing');
    input.focus();
    const label = btn.getAttribute('data-label');
    btn.textContent = label + '(save)';
    btn.style.background = '#d9534f';
  } else {
    input.readOnly = true;
    input.classList.remove('editing');
    const label = btn.getAttribute('data-label');
    btn.textContent = label + '(mod.)';
    btn.style.background = '';
    // save to sheet
    if (pdfCurrentRow) {
      const key = field === 'apa' ? 'apa' : 'url';
      pdfCurrentRow[key] = input.value;
      savePdfField(pdfCurrentRow.no, key, input.value);
    }
  }
}
